<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>சுந்தரராஜு ஆன்மிகக் கற்றல் உலகம் – கிருஷ்ணர் பொன்மொழிகள் 200</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;700&family=Noto+Serif+Tamil:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b1d2b;
  --deep:#10303f;
  --peacock:#16808a;
  --gold:#e8b24a;
  --cream:#f7f1e1;
  --muted:#a9bcc4;
  --card:#143a4a;
  --line:rgba(247,241,225,.14);
  --serif:"Noto Serif Tamil","Latha","Nirmala UI",serif;
  --sans:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif;
}
:root[data-theme="light"]{
  --night:#f6f1e3;
  --deep:#e6ecdf;
  --peacock:#0e6b74;
  --gold:#a4690a;
  --cream:#15303c;
  --muted:#4f6670;
  --card:#fffaf0;
  --line:rgba(21,48,60,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--night);color:var(--cream);
  font-family:var(--sans);line-height:1.7;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- header ---------- */
header.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);
}
.brand{font-family:var(--serif);font-weight:700;font-size:clamp(1.05rem,2.6vw,1.45rem);color:var(--gold);margin:0}
.theme-btn{
  background:none;border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;cursor:pointer;color:var(--muted);
}
.theme-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;
  padding:clamp(28px,6vw,72px) clamp(16px,4vw,48px);
  background:
    radial-gradient(900px 500px at 85% 0%, rgba(22,128,138,.45), transparent 60%),
    linear-gradient(180deg,var(--deep),var(--night));
  border-bottom:1px solid var(--line);
}
.feather{
  position:absolute;right:-90px;top:-90px;width:380px;height:380px;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, #0a2a66 0 11%, #1da0a8 12% 20%, #1f7a4d 21% 30%, #e8b24a 31% 36%, #16808a 37% 52%, transparent 53%);
  opacity:.5;pointer-events:none;
}
:root[data-theme="light"] .feather{opacity:.28}
.hero-inner{position:relative;max-width:900px;margin:0 auto}
.hero h1{
  font-family:var(--serif);font-size:clamp(1.6rem,5vw,2.8rem);
  line-height:1.35;margin:0 0 4px;
}
.hero .sub{color:var(--muted);margin:0 0 28px;font-size:1.05rem}
.saying{
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);
  border-radius:10px;padding:clamp(18px,3vw,32px);
  box-shadow:0 18px 40px rgba(0,0,0,.25);
}
.saying .meta{color:var(--gold);font-size:.95rem;margin:0 0 8px}
.saying .text{
  font-family:var(--serif);font-size:clamp(1.25rem,3.4vw,1.9rem);line-height:1.65;margin:0;
  min-height:3.3em;
}
.saying .text.swap{animation:swap .35s ease}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{
  background:transparent;border:1px solid var(--line);border-radius:8px;
  padding:8px 16px;cursor:pointer;transition:background .15s,border-color .15s;
}
.btn:hover{border-color:var(--gold);background:rgba(232,178,74,.1)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#12222c;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}

.detail{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:14px}
.detail h2{font-family:var(--sans);font-size:.95rem;font-weight:700;color:var(--gold);margin:0 0 2px}
.detail p{margin:0;font-size:1.05rem;line-height:1.85}
.detail .eg{border-left:4px solid var(--peacock);padding-left:14px}
details.more{border-top:1px dashed var(--line);padding-top:8px}
details.more summary{cursor:pointer;color:var(--peacock);font-weight:500;list-style-position:inside}
:root:not([data-theme="light"]) details.more summary{color:#5fc4cc}
details.more h3{font-size:.88rem;color:var(--gold);margin:10px 0 2px}
details.more p{font-family:var(--sans);font-size:.95rem;line-height:1.75;color:var(--cream)}
/* ---------- controls ---------- */
.controls{
  position:sticky;top:0;z-index:5;background:var(--night);
  padding:14px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);
}
.controls-in{max-width:1100px;margin:0 auto;display:grid;gap:12px}
.search{
  width:100%;padding:11px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);
}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:none;border-radius:999px;
  padding:5px 14px;cursor:pointer;color:var(--muted);white-space:nowrap;
}
.chip:hover{border-color:var(--peacock);color:var(--cream)}
.chip[aria-pressed="true"]{background:var(--peacock);border-color:var(--peacock);color:#fff}
.count{color:var(--muted);font-size:.92rem;margin:0}

/* ---------- list ---------- */
main{max-width:1100px;margin:0 auto;padding:24px clamp(16px,4vw,48px) 56px}
.grid{list-style:none;margin:0;padding:0;display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.item{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:16px 16px 14px;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;
}
.item:hover{border-color:var(--peacock)}
.item.active{border-color:var(--gold)}
.item .no{font-size:.85rem;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.item .no span:last-child{color:var(--muted)}
.item p{margin:0;font-family:var(--serif);font-size:1.05rem;line-height:1.7}
.fav{
  background:none;border:none;cursor:pointer;font-size:1.15rem;line-height:1;
  color:var(--muted);padding:2px 4px;border-radius:4px;
}
.fav[aria-pressed="true"]{color:#e0577a}
.empty{text-align:center;color:var(--muted);padding:48px 0}

footer{
  border-top:1px solid var(--line);padding:22px clamp(16px,4vw,48px);
  text-align:center;color:var(--muted);font-size:.9rem;
}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:var(--gold);color:#12222c;padding:8px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.25s;font-weight:700;z-index:10
}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
@media (max-width:600px){.feather{width:260px;height:260px;right:-100px;top:-100px}}
</style>
</head>
<body>

<header class="top">
  <p class="brand">சுந்தரராஜு ஆன்மிகக் கற்றல் உலகம்</p>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="நிறத்தை மாற்று">☀ / ☾</button>
</header>

<section class="hero" aria-labelledby="pageTitle">
  <div class="feather" aria-hidden="true"></div>
  <div class="hero-inner">
    <h1 id="pageTitle">கிருஷ்ணர் பொன்மொழிகள் 200</h1>
    <p class="sub">வாழ்வை ஒளிரச் செய்யும் இருநூறு ஆன்மிக வாக்குகள்</p>

    <article class="saying" aria-live="polite">
      <p class="meta" id="meta"></p>
      <p class="text" id="text"></p>
      <div class="detail">
        <div><h2>விளக்கம்</h2><p id="vilakkam"></p></div>
        <div class="eg"><h2>உதாரணம்</h2><p id="udharanam"></p></div>
      </div>
      <div class="actions">
        <button class="btn" id="prev" type="button">‹ முந்தையது</button>
        <button class="btn primary" id="rand" type="button">புதிய பொன்மொழி</button>
        <button class="btn" id="next" type="button">அடுத்தது ›</button>
        <button class="btn" id="heroFav" type="button" aria-pressed="false">♥ பிடித்தது</button>
        <button class="btn" id="copy" type="button">நகலெடு</button>
        <button class="btn" id="share" type="button">பகிர்</button>
      </div>
    </article>
  </div>
</section>

<div class="controls">
  <div class="controls-in">
    <input class="search" id="search" type="search" placeholder="பொன்மொழிகளில் தேடுங்கள்…" aria-label="தேடல்">
    <div class="chips" id="chips" role="group" aria-label="வகைகள்"></div>
    <p class="count" id="count"></p>
  </div>
</div>

<main>
  <ul class="grid" id="grid"></ul>
  <p class="empty" id="empty" hidden>பொருந்தும் பொன்மொழி இல்லை. வேறு சொல்லில் தேடுங்கள்.</p>
</main>

<footer>
  © சுந்தரராஜு ஆன்மிகக் கற்றல் உலகம் • கிருஷ்ணரின் உபதேசங்களை அடிப்படையாகக் கொண்ட பொன்மொழிகள்
</footer>

<div class="toast" id="toast" role="status"></div>

  "பலனை எதிர்பார்க்காமல் செய்யும் செயலே தூய்மையான செயல்.",

 {n:"பக்தி", s:[
  "அன்புடன் எனக்கு ஒரு இலை, மலர், நீர் தந்தாலும் ஏற்பேன்.",

  "இன்சொல் பேசுவது ஒரு தவம்.",
  "உதவி செய்; ஆனால் பதிலுக்கு எதிர்பாராதே.",
  "எல்லோரும் ஒரே இறைவனின் அம்சங்கள்.",
  "பெற்றோரை மதிப்பது முதல் தர்மம்.",
  "சிரிப்பு பிறருக்குக் கொடுக்கும் எளிய தானம்.",
  "நண்பனின் வெற்றியில் மகிழ்.",
  "மன்னிப்பு வலிமையின் அடையாளம்.",
  "பகிர்ந்து உண்பவன் பசியறியான்.",
  "அன்பான சொல் பகைவனையும் மாற்றும்.",
  "பிறரை உயர்த்துபவன் தானும் உயர்கிறான்.",
  "அகங்காரம் விலகினால் அன்பு மலரும்.",
  "தாய் மண்ணையும் மக்களையும் நேசி.",
  "குழந்தைகளுக்கு நல்ல பழக்கத்தைக் கற்றுக்கொடு.",
  "ஏழைக்கு உதவும் கை இறைவனின் கை.",
  "அன்பே எல்லா மதங்களின் சாரம்."]},
 {n:"ஞானம்", s:[
  "அறிவு போல் தூய்மையானது எதுவும் இல்லை.",
  "கற்றலுக்கு முடிவில்லை; தொடர்ந்து கற்றுக்கொள்.",
  "ஆன்மா பிறப்பதில்லை; இறப்பதில்லை.",
  "உடல் மாறும்; ஆன்மா மாறாது.",
  "உண்மையைத் தேடுபவனுக்கு குரு வழிகாட்டுவார்.",
  "கேள்வி கேட்பது ஞானத்தின் முதல் படி.",
  "அறியாமையே துயரின் வேர்.",
  "அடக்கம் ஞானியின் அணிகலன்.",
  "கற்றதை வாழ்வில் பின்பற்றுவதே உண்மையான கல்வி.",
  "எது நிலையானது, எது நிலையற்றது என்பதைப் பகுத்தறி.",
  "ஞானம் இருளை அகற்றும் விளக்கு.",
  "தனக்குத் தெரியாததை ஒப்புக்கொள்வது அறிவின் தொடக்கம்.",
  "நல்ல நூல்கள் நல்ல நண்பர்கள்.",
  "உள்ளே பார்; விடைகள் அங்கே உள்ளன.",
  "பணிவுடன் கற்றால் அறிவு ஆழமாகும்.",
  "தோற்றத்தை விட உண்மையைப் பார்.",
  "பேசுவதை விட கேட்பவன் அதிகம் கற்கிறான்.",
  "அனுபவமே சிறந்த ஆசான்.",
  "அறிந்ததைப் பகிர்; அறிவு பெருகும்.",
  "ஞானம் தெளிவையும், தெளிவு அமைதியையும் தரும்."]},
 {n:"செயலும் பலனும்", s:[
  "வெற்றியிலும் தோல்வியிலும் சமநிலை காப்பாய்.",
  "பலன் மீது பற்று வைத்தால் செயல் சிதறும்.",
  "தோல்வி என்பது முடிவல்ல; அது பாடம்.",
  "இன்பமும் துன்பமும் வந்து போகும் பருவங்கள்.",
  "விதைப்பதே உன் வேலை; அறுவடையைக் காலம் தீர்மானிக்கும்.",
  "முயற்சியின் அழகு பலனை விடப் பெரியது.",
  "பற்றை விடு; செயலை விடாதே.",
  "எதிர்பார்ப்பு குறைந்தால் ஏமாற்றம் குறையும்.",
  "இன்று செய்யும் நற்செயல் நாளை உன்னைக் காக்கும்.",
  "நீ விதைத்ததையே அறுப்பாய்.",
  "தடைகள் உன் வலிமையைச் சோதிக்கும்.",
  "தோல்விக்குப் பின் எழுபவனே வீரன்.",
  "நேர்மையான வழியில் வந்த வெற்றி நிலைக்கும்.",
  "புகழ்ச்சியிலும் இகழ்ச்சியிலும் ஒரே மனநிலை கொள்.",
  "வேகத்தை விட திசை முக்கியம்.",
  "சிறு முயற்சிகள் சேர்ந்து பெரிய மலையாகும்.",
  "நடப்பது எல்லாம் நன்மைக்கே என நம்பு.",
  "காத்திருக்கவும் கற்றுக்கொள்.",
  "செயலில் தெளிவு இருந்தால் தயக்கம் இருக்காது.",
  "ஒவ்வொரு நாளும் புதிய தொடக்கம்."]},
 {n:"அமைதி", s:[
  "அமைதியுள்ள மனமே உண்மையான செல்வம்.",
  "அமைதி இல்லாதவனுக்கு மகிழ்ச்சி ஏது?",
  "புயலுக்கு நடுவிலும் மலை போல் நிலையாக இரு.",
  "மௌனம் சில நேரங்களில் சிறந்த பதில்.",
  "அவசரம் குழப்பத்தைத் தரும்; பொறுமை தெளிவைத் தரும்.",
  "ஆசைகளைக் குறைத்தால் மனம் அமைதி பெறும்.",
  "தனிமையில் சிறிது நேரம் உன்னோடு இரு.",
  "ஆழ்ந்த மூச்சு கோபத்தைத் தணிக்கும்.",
  "போதும் என்ற மனமே பொன் செய்யும் மருந்து.",
  "சத்தம் குறைந்தால் இதயத்தின் குரல் கேட்கும்.",
  "தேவையில்லாத வாதங்களைத் தவிர்.",
  "அமைதியாக இருப்பவன் பலவீனன் அல்ல.",
  "இயற்கையுடன் நேரம் செலவிடு; மனம் ஆறும்.",
  "கடந்ததை மறந்து நிகழ்காலத்தில் வாழ்.",
  "நிம்மதியான உறக்கம் நல்ல மனசாட்சியின் பரிசு.",
  "எளிமையான வாழ்வில் பெரிய நிம்மதி உண்டு.",
  "பிறர் சொற்களால் உன் அமைதியை இழக்காதே.",
  "சிக்கல்களை அமைதியாகப் பார்த்தால் தீர்வு தெரியும்.",
  "மனம் தெளிந்த குளம் போல இருக்கட்டும்.",
  "அமைதியே ஆன்மிகத்தின் வாசல்."]},
 {n:"நம்பிக்கை", s:[
  "அஞ்சாதே; நான் உன்னுடன் இருக்கிறேன்.",
  "நம்பிக்கை உள்ளவனுக்கு மலையும் மடு.",
  "சந்தேகம் மனதைச் சிதைக்கும்.",
  "துணிவே வெற்றியின் முதல் படி.",
  "இருள் எவ்வளவு அடர்ந்தாலும் விடியல் வரும்.",
  "உன்னை நம்பு; உன்னுள் வலிமை உண்டு.",
  "தளராதவனுக்குத் தோல்வி இல்லை.",
  "பயம் எண்ணத்தில்தான் உள்ளது.",
  "சவால்கள் உன்னைச் செதுக்கும் உளி.",
  "உறுதியான மனம் எதையும் சாதிக்கும்.",
  "நெருக்கடியில் தெளிவாகச் சிந்தி.",
  "முதல் அடி எடுத்து வை; பாதை தெரியும்.",
  "எழுந்து நில்; போராடு; தயங்காதே.",
  "பிறர் ஏளனத்துக்கு அஞ்சி கனவை விடாதே.",
  "தோல்வி கண்டு துவளாதே; மீண்டும் முயல்.",
  "நம்பிக்கை உன் மனதின் ஒளி.",
  "இறை நம்பிக்கை உன் கேடயம்.",
  "தைரியம் என்பது பயமின்மை அல்ல; பயத்தை மீறிச் செயல்படுவது.",
  "உறுதியுடன் நின்றால் உலகமும் வழிவிடும்.",
  "எதிர்காலத்தை நம்பிக்கையுடன் எதிர்கொள்."]},
 {n:"தர்மம்", s:[
  "தர்மம் தலை காக்கும்; அதர்மம் அழிவைத் தரும்.",
  "உண்மை பேசுவது தவத்துக்கு ஒப்பு.",
  "நேர்மை உள்ளவனுக்கு மறைக்க ஏதுமில்லை.",
  "அநீதியைக் கண்டு மௌனம் காக்காதே.",
  "நீதிக்காக நிற்பவன் தனியாக இல்லை.",
  "பேராசை அழிவின் பாதை.",
  "பிறர் பொருளுக்கு ஆசைப்படாதே.",
  "தானம் செய்வது செல்வத்தைத் தூய்மையாக்கும்.",
  "வாக்குறுதியைக் காப்பாற்று.",
  "நல்லவர்களைக் காக்க வலிமை தேவை.",
  "சுயநலத்தை விட பொதுநலம் பெரிது.",
  "செய்வது சரியா என மனசாட்சியிடம் கேள்.",
  "சிறிய பொய்யும் மனதைக் கனக்கச் செய்யும்.",
  "அதிகாரம் பொறுப்பையும் கொண்டுவரும்.",
  "நல்ல வழியில் ஈட்டிய பொருளே நிலைக்கும்.",
  "பிறரை ஏமாற்றுபவன் தன்னையே ஏமாற்றுகிறான்.",
  "நீதி வழுவாத அரசு நீடிக்கும்.",
  "தவறை ஒப்புக்கொள்வது பெரும் துணிவு.",
  "நல்லொழுக்கமே உயர்ந்த செல்வம்.",
  "எப்போதும் தர்மத்தின் பக்கம் நில்."]},
 {n:"வாழ்க்கை", s:[
  "வாழ்க்கை ஒரு பயணம்; ஒவ்வொரு நிமிடமும் ஒரு பாடம்.",
  "மாற்றம் ஒன்றே மாறாதது.",
  "இன்றைய நாளை முழுமையாக வாழ்.",
  "பிறப்பும் இறப்பும் இயற்கையின் சுழற்சி.",
  "எல்லாம் கடந்து போகும்.",
  "இருப்பதில் நிறைவு கொள்.",
  "நேரம் மீண்டும் வராது; அதை மதி.",
  "நல்ல நண்பர்களுடன் பயணம் செய்.",
  "சமநிலையே வாழ்வின் கலை.",
  "உடலைப் பேணு; அது ஆன்மாவின் கோயில்.",
  "எளிமையான உணவு, எளிமையான எண்ணம்.",
  "நேற்றைய தவறுகளிலிருந்து கற்று, நாளையை நோக்கி நட.",
  "இயற்கையை நேசி; அது இறைவனின் படைப்பு.",
  "மகிழ்ச்சி வெளியே இல்லை; உன்னுள் உள்ளது.",
  "குறைகளை விட நிறைகளைக் காண்.",
  "வாழ்வின் நோக்கம் உன்னை நீயே அறிவதே.",
  "எல்லா முடிவுகளும் புதிய தொடக்கங்களே.",
  "சேவை செய்யும் வாழ்வே சிறந்த வாழ்வு.",
  "அன்புடன் வாழ்; அறத்துடன் வாழ்; அமைதியுடன் வாழ்.",
  "எங்கும் நான் இருக்கிறேன்; நம்பிக்கையுடன் நட, வெற்றி உன்னுடையது."]}
];

/* ---------- விளக்கம் & உதாரணம்: [விளக்கம், உதாரணம்] – பொன்மொழி வரிசையிலேயே ---------- */
const EXPL = [
["முயற்சி செய்வது மட்டுமே நம் கையில்; வெற்றி தோல்வியை நினைத்துக் கலங்காமல் பணியில் கவனம் வை.","தேர்வுக்கு நன்றாகப் படிப்பது மாணவனின் வேலை; மதிப்பெண் பற்றிய பயத்தால் படிப்பை நிறுத்தக்கூடாது."],
["சும்மா இருப்பதை விட நல்ல செயலில் ஈடுபடுவது உடலுக்கும் மனதுக்கும் நன்மை தரும்.","வேலை இல்லாத நாளில் வீட்டைச் சுத்தம் செய்தால் மனம் தெளிவாகும்."],
["எதிர்பார்ப்பு இல்லாத செயலில் சுயநலம் கலப்பதில்லை; அதனால் அது தூய்மையானது.","மருத்துவர் நன்றியை எதிர்பாராமல் நோயாளிக்குச் சிகிச்சை அளிப்பது."],
["பிறர் வழியை நகல் எடுப்பதை விட, குறை இருந்தாலும் நமக்கு உரிய பணியைச் செய்வது மேல்.","விவசாயி மகன் தன் நிலத்தில் உழைப்பது, நகரத்து வேலையைப் பார்த்து ஏங்குவதை விடச் சிறந்தது."],
["தன் பொறுப்பை நேர்மையாகச் செய்பவனுக்கு குற்றவுணர்வும் பயமும் இருக்காது.","தினமும் சரியாகப் பாடம் நடத்தும் ஆசிரியர் ஆய்வுக்கு அஞ்ச மாட்டார்."],
["வேலையை இறைவனுக்குச் செய்யும் சேவையாகக் கருதினால் அதில் ஆர்வமும் தரமும் கூடும்.","சமையல் செய்பவர் ‘இது குடும்பத்துக்கான பிரசாதம்’ என நினைத்தால் மகிழ்ச்சியுடன் சமைப்பார்."],
["தள்ளிப்போடுவது வேலையைக் குவித்து மன அழுத்தத்தை உண்டாக்கும்.","இன்றே கட்டணத்தைச் செலுத்தினால் நாளை அபராதம் இல்லை."],
["பொறுப்பை ஏற்றுக்கொண்டு, தவறு நடந்தால் அதற்கும் பதில் சொல்பவனையே மக்கள் நம்புவர்.","குழுவின் தோல்விக்குத் தலைவன் தானே பொறுப்பேற்றால் குழு அவனை மதிக்கும்."],
["பணியில் மனம் சிதறாமல் ஈடுபட்டால் தரம் உயர்ந்து வெற்றி தேடி வரும்.","கைபேசி பார்க்காமல் படித்தால் ஒரு மணி நேரத்தில் இரண்டு மணி நேரப் பாடம் முடியும்."],
["சோம்பல் திறமையையும் நேரத்தையும் வீணாக்கி வாய்ப்புகளை இழக்கச் செய்யும்.","நாளை பார்க்கலாம் என்று தினமும் தள்ளியவன் நடைப்பயிற்சிப் பழக்கத்தை இழந்தான்."],
["உண்மையான உழைப்பாளி பாராட்டுக்காகக் காத்திராமல் பணியின் நிறைவிலேயே மகிழ்வான்.","கோயிலைச் சுத்தம் செய்பவர் யாரும் பார்க்காவிட்டாலும் தினமும் அதைச் செய்கிறார்."],
["கடின உழைப்பே முன்னேற்றத்துக்கான நுழைவாயில்; குறுக்கு வழி நிலைக்காது.","தினமும் பயிற்சி செய்த வீரன் போட்டியில் வென்றான்."],
["ஆரம்பிப்பது எளிது; முடிக்க மன உறுதி தேவை. பாதியில் விட்டவை பயன் தராது.","புத்தகம் எழுத ஆரம்பித்து, தினமும் ஒரு பக்கம் எழுதி ஆறு மாதத்தில் முடித்தல்."],
["செயலை இறைவனுக்குச் சமர்ப்பிப்பவன் அகந்தையும் பதற்றமும் இன்றி நிதானமாகச் செய்வான்.","தேர்வு எழுதும் முன் ‘என் முயற்சியை இறைவனிடம் வைக்கிறேன்’ என்று நினைத்து அமைதியாக எழுதுதல்."],
["கடமையை நாம் சுமையாக நினைத்தால் கனக்கும்; வாழ்வின் பாதையாகக் கண்டால் நம்மை முன்னே நடத்தும்.","குடும்பப் பொறுப்பை அன்புடன் ஏற்பவன் சோர்வடையாமல் உழைக்கிறான்."],
["பிடித்துச் செய்யும் பணி சலிப்பை நீக்கி மன நிறைவைத் தரும்.","ஓவியம் வரைவதில் மகிழ்பவர் இரவு வரை வரைந்தாலும் களைப்படைவதில்லை."],
["சிறிய பணியிலும் கவனம் இருந்தால் அது பெரிய பயனைத் தரும்.","ஒரு சிறு கணக்குப் பிழையைத் திருத்தியதால் நிறுவனம் பெரிய நஷ்டத்திலிருந்து தப்பியது."],
["தனக்காக மட்டும் அல்லாமல் பிறர் நலனுக்காகவும் உழைப்பவரை சமூகம் மதிக்கும்.","ஊருக்காகக் குளம் தூர்வாரிய இளைஞர்களை மக்கள் வாழ்த்தினர்."],
["நம் செயல் நம் உரிமை; விளைவு பல காரணங்களைப் பொறுத்தது. இதை உணர்ந்தால் மனம் பாரமின்றி இருக்கும்.","வேலை நேர்காணலுக்கு நன்றாகத் தயாராவது நம் பணி; தேர்வு செய்வது நிறுவனத்தின் முடிவு."],
["கடமையில் உறுதியான மனம் தூய்மையாகி, அதுவே இறைவன் தங்கும் ஆலயமாகிறது.","நாள்தோறும் தாய் தந்தையைக் கவனிப்பவனுக்கு அவன் வீடே கோயில்."],
["இறைவன் பொருளை அல்ல, அன்பையே பார்க்கிறான்; எளிய காணிக்கையும் அன்புடன் தந்தால் போதும்.","ஏழைப் பக்தர் தன்னிடம் இருந்த ஒரு துளசி இலையை அன்புடன் அர்ப்பணித்தல்."],
["இறைவனிடம் முழு நம்பிக்கை வைத்தவனுக்கு தேவையானவற்றை இறைவன் காக்கிறான்.","கடினமான காலத்திலும் தினமும் பிரார்த்தித்த பெண்மணிக்கு எதிர்பாராத உதவி கிடைத்தது."],
["நம் அகந்தையை விட்டு, இறைவன் திட்டத்தை ஏற்பதே சரணாகதி.","‘நான் செய்கிறேன்’ என்பதை விட்டு ‘உன் விருப்பம்’ எனக் கூறி அமைதி பெறுதல்."],
["பாரத்தை இறைவனிடம் இறக்கி வைத்தவன் மனம் இலகுவாகும்; ஆனாலும் முயற்சியை விடக்கூடாது.","கவலையால் தூங்காதவன் பிரார்த்தனை செய்தபின் நிம்மதியாக உறங்கினான்."],
["இறைநாமம் மனதைத் தூய்மையாக்கி துயரத்தை மறக்கச் செய்யும்.","துக்கமான நேரத்தில் கிருஷ்ண நாமம் சொல்லி மனம் தேறியவர்."],
["வரம் கேட்பதற்காக அல்ல, அன்புக்காகவே செய்யும் வழிபாடு உயர்ந்தது.","பலன் கேளாமல் தினமும் விளக்கேற்றும் பாட்டி."],
["உணவை நன்றியுடன் இறைவனுக்கு அர்ப்பணித்து உண்டால் அது வழிபாடாகிறது.","சாப்பிடும் முன் ஒரு கணம் கண்மூடி நன்றி சொல்லுதல்."],
["எல்லா உயிரிலும் இறைவன் உள்ளான் என்று உணர்பவன் யாரையும் வெறுக்க மாட்டான்.","எறும்புக்கும் உணவிட்டு, பிச்சைக்காரனுக்கும் மரியாதை தருபவன்."],
["உறுதியான நம்பிக்கை மனதில் தெளிவைத் தந்து, தேவையான வழியைக் காட்டும்.","வழி தெரியாமல் தவித்தவன் அமைதியாக வேண்டியபின் ஒரு நல்ல ஆலோசனையைப் பெற்றான்."],
["நாம் முயன்றாலும் சுமை கடினமாக இருந்தால் இறைவன் துணை நிற்பான் என்ற நம்பிக்கை ஆறுதல் தரும்.","நோயாளி மருத்துவச் சிகிச்சையுடன் நம்பிக்கையும் வைத்து மன தைரியம் பெற்றார்."],
["உண்மையான பக்தன் தான் பக்தன் என்று பெருமைப்பட மாட்டான்; அடக்கமாக இருப்பான்.","தானம் செய்தும் பெயர் வெளியிடாத பக்தர்."],
["சிறிது நேரமாவது இறைவனுக்கு ஒதுக்கினால் மனதில் ஒழுங்கும் அமைதியும் வரும்.","காலையில் பத்து நிமிடம் அமைதியாக அமர்ந்து பிரார்த்திப்பது."],
["இறைவனை அடைய செலவு அல்ல, தூய அன்பே முக்கியம்.","பணம் இல்லாதவன் ஒரு பூவால் மகிழ்ந்து வழிபடுவது."],
["இறைவனிடம் சரணடைந்தவன் எதையும் இழக்க அஞ்ச மாட்டான்.","தேர்வுப் பயம் உள்ள மாணவன் இறைவனிடம் ஒப்படைத்து தைரியமாக எழுதினான்."],
["இறைவனுக்கு இடம் கோயிலில் மட்டும் அல்ல; தூய இதயமே அவன் வசிக்கும் இடம்.","கோபத்தை விட்டு அன்பாகப் பேசுவதால் இதயம் ஆலயமாகிறது."],
["இறை நினைவுடன் செய்யும் வேலையில் தவறு செய்யும் எண்ணம் குறையும்.","‘இறைவன் பார்க்கிறான்’ என்ற எண்ணத்தில் நேர்மையாக வியாபாரம் செய்தவர்."],
["துன்பம் வரும்போதும் இறைவனை நினைப்பவன் மனம் உடையாது.","வியாபார நஷ்டத்திலும் நம்பிக்கை இழக்காமல் மீண்டும் தொடங்கியவர்."],
["பக்தி கடின மனதையும் கருணை நிறைந்ததாக மாற்றும்.","கோபக்காரராக இருந்தவர் தினமும் வழிபட்டு பொறுமையானவராக மாறினார்."],
["கிடைத்தவற்றுக்கு நன்றி சொல்வது கேட்பதை விட உயர்ந்த பிரார்த்தனை.","இரவில் அன்றைய நன்மைகளை நினைத்து நன்றி கூறுதல்."],
["மனம் அமைதியானால் இறைவனின் உள்ளுணர்வுக் குரலை உணரலாம்.","பரபரப்பை விட்டு அமைதியில் அமர்ந்தபோது சிக்கலுக்குத் தீர்வு தோன்றியது."],
["கட்டுப்பாடுள்ள மனம் உதவும் நண்பன்; கட்டுப்பாடற்ற மனம் தீங்கு செய்யும் பகைவன்.","தள்ளிப்போடும் மனதை ஒழுங்குபடுத்தி வெற்றி பெற்றவன்."],
["தன் மனதை ஆள்பவன் சூழலால் அலைக்கழிக்கப்பட மாட்டான்.","கோபமூட்டும் பேச்சைக் கேட்டும் அமைதியாக இருந்தவன்."],
["தொடர் பயிற்சியால் அலைபாயும் மனதைப் பழக்கலாம்.","தினமும் ஐந்து நிமிடம் மூச்சுப் பயிற்சி செய்து கவனம் கூடியவன்."],
["நாம் தொடர்ந்து நினைப்பவையே நம் குணமாகவும் செயலாகவும் மாறும்.","எப்போதும் ‘என்னால் முடியும்’ என நினைத்தவன் முயற்சியைக் கைவிடவில்லை."],
["கோபத்தில் சிந்திக்கும் திறன் குறைந்து தவறான முடிவு எடுக்கிறோம்.","கோபத்தில் பேசி நண்பனை இழந்து பின்னர் வருந்தியவன்."],
["ஆசைக்கு எல்லை இல்லாவிட்டால் திருப்தி இல்லாமல் துன்பம் வளரும்.","பல பொருட்கள் வாங்கியும் மகிழ்ச்சியில்லாமல் கடனில் மூழ்கியவர்."],
["அமைதியான மனநிலையில் எடுக்கும் முடிவு பெரும்பாலும் சரியாக இருக்கும்.","முக்கிய முடிவுக்கு முன் ஒரு நாள் யோசித்துத் தெளிந்தவர்."],
["நம்மை ஊக்குவிப்பதும் தாழ்த்துவதும் நம் எண்ணங்களே; ஆகவே நம்மிடம் நாமே கனிவாக இருக்க வேண்டும்.","தவறு செய்தபின் ‘நான் பயனற்றவன்’ என்பதற்குப் பதில் ‘அடுத்து சரி செய்வேன்’ என நினைத்தல்."],
["பிறர் வளர்ச்சியைப் பார்த்து எரிவது நம் மன நிம்மதியையே அழிக்கும்.","நண்பன் பதவி உயர்வு பெற்றதை மனதார வாழ்த்தி நிம்மதி கண்டவன்."],
["கடந்த காலத்தைப் பற்றிய கவலையும் வராத எதிர்காலம் பற்றிய பயமும் இன்றைய நாளைப் பாழாக்கும்.","நாளைய தேர்வு பற்றி இன்று முழுதும் பயந்து படிக்க மறந்த மாணவன்."],
["தியானம் எண்ணங்களை அடங்கச் செய்து மனதை நீர் போல தெளிவாக்கும்.","சேறு படிந்த நீர் அமைதியானால் தெளிவது போல மனமும் தெளிகிறது."],
["ஆசைகளுக்கு அடிமையாகாமல் புலன்களைக் கட்டுப்படுத்துபவன் உண்மையில் அறிவாளி.","இனிப்பு ஆசையை அளவோடு கட்டுப்படுத்தி உடல்நலம் காத்தவன்."],
["பயனற்ற எண்ணங்களை விட்டால் மனதின் சுமை குறையும்.","நடந்து போன சண்டையை மீண்டும் நினைக்காமல் விடுதல்."],
["உள்ளம் தூய்மையாக இருந்தால் அது முகத்தில் அமைதியாகவும் ஒளியாகவும் தெரியும்.","கள்ளமில்லாமல் பழகுபவரின் முகம் எப்போதும் மலர்ச்சியுடன் இருக்கும்."],
["தன்னை நிதானத்தில் வைத்திருக்கும் திறனே உண்மையான பலம்.","கேலி செய்தவரிடம் சண்டை போடாமல் புன்னகைத்துக் கடந்தவன்."],
["மூச்சைக் கவனித்தால் மனம் உடனே நிகழ்காலத்துக்கு வரும்.","பதற்றம் வந்தபோது மூன்று முறை ஆழ்ந்து மூச்சு விட்டு நிதானம் பெறுதல்."],
["தன் குறைகளை உணர்ந்தவன் பிறரைக் குறை கூறுவதில் நேரம் செலவிட மாட்டான்.","தன் தவறை ஒப்புக்கொண்டவன் மற்றவரைத் திட்டுவதில்லை."],
["பிறருடன் ஒப்பிடுவது நம்மிடம் உள்ள நன்மைகளையும் மறக்கச் செய்கிறது.","சமூக வலைதளப் படங்களைப் பார்த்து தன் வாழ்க்கை குறைவு எனக் கருதிய இளைஞன்."],
["மன்னிப்பது பிறருக்கான கருணை மட்டுமல்ல; நம் மன பாரமும் குறையும்.","பல ஆண்டுப் பகையை மன்னித்தபின் தூக்கம் சீரானது."],
["பேசும் முன்னும் செயல்படும் முன்னும் ஒரு கணம் யோசிப்பது வருத்தத்தைத் தடுக்கும்.","அனுப்பும் முன் மின்னஞ்சலை மீண்டும் படித்து ஒரு கடுமையான சொல்லை நீக்கியவர்."],
["எல்லா உயிரும் இறைவனின் படைப்பு என உணர்ந்தால் வெறுப்பு மறையும்.","தெருநாய்க்கும் உணவளித்து, எல்லா மதத்தாரிடமும் அன்பாகப் பழகுபவர்."],
["கருணை பலவீனம் அல்ல; அது தைரியமுள்ள மனதிலேயே பிறக்கும்.","தன்னை அவமதித்தவருக்கும் உதவிய வீரன்."],
["நம்பிக்கை, நேர்மை ஆகியவையே நட்பின் அடிப்படை.","நண்பன் இல்லாத இடத்தில் அவனைப் பற்றி தவறாகப் பேசாதவன்."],
["பிறர் வலியை உணரும் மனம் உதவி செய்யத் தூண்டும்.","அழுதுகொண்டிருந்த சிறுவனை ஆறுதல் படுத்தி வீடு சேர்த்த பெண்."],
["அன்பைப் பகிர்ந்தால் குறையாது; இன்னும் பெருகும்.","அன்பாகப் பழகும் ஆசிரியரிடம் மாணவர்களின் அன்பும் கூடுகிறது."],
["இனிய சொல் செலவில்லாத தவம்; அது பிறர் மனதைக் குளிர்விக்கும்.","கடைக்காரரிடம் ‘நன்றி’ எனப் புன்னகையுடன் சொல்லுதல்."],
["உதவி செய்து பிரதிபலன் எதிர்பார்த்தால் அது வியாபாரமாகிவிடும்.","வழிப்போக்கனுக்கு நீர் தந்து பெயர் கேட்காமல் சென்றவர்."],
["எல்லோருள்ளும் ஒரே இறை உள்ளதால் உயர்வு தாழ்வு பார்க்கக் கூடாது.","வேலைக்காரரையும் குடும்ப உறுப்பினர் போல மதிப்பவர்."],
["நம்மை வளர்த்த பெற்றோருக்கு மரியாதையும் பணிவும் செய்வது முதன்மைக் கடமை.","வேலைக்குச் சென்றபின்னும் தினமும் அம்மாவிடம் நலம் விசாரிக்கும் மகன்."],
["புன்சிரிப்பு எளிய செலவற்ற பரிசு; பிறர் நாளை இனிமையாக்கும்.","பேருந்தில் அறிமுகமில்லாதவரைப் பார்த்து புன்னகைத்தல்."],
["பிறர் வெற்றியில் மகிழ்வது நம் உள்ளத்தின் பெருந்தன்மையைக் காட்டும்.","நண்பன் பரிசு வென்றபோது முதலில் வாழ்த்தியவன்."],
["மன்னிக்க மனவலிமை வேண்டும்; பலவீனர்களால் முடியாது.","தவறு செய்த தம்பியை மன்னித்து வழிகாட்டிய அண்ணன்."],
["உணவைப் பகிரும் பழக்கம் சமூகத்தில் யாரும் பசியால் வாடாமல் காக்கும்.","பண்டிகை உணவை அண்டை வீட்டாருடன் பகிர்தல்."],
["கனிவான சொல் கோபத்தையும் தணித்து உறவை சீராக்கும்.","கோபமாக வந்தவரிடம் அமைதியாகப் பேசி பிரச்சினையைத் தீர்த்தவர்."],
["பிறரை உயர்த்தும்போது நம் மதிப்பும் உயரும்.","புதிய பணியாளருக்கு கற்றுத் தந்த மூத்தவர் குழுவின் நம்பிக்கையைப் பெற்றார்."],
["நான் என்ற செருக்கு குறைந்தால்தான் பிறர்மீது உண்மை அன்பு தோன்றும்.","தன் தவறை ஒப்புக்கொண்டு மன்னிப்புக் கேட்டதால் உறவு மலர்ந்தது."],
["நாட்டையும் சமூகத்தையும் நேசிப்பது பொறுப்புணர்வையும் சேவையையும் வளர்க்கும்.","தன் ஊரின் தூய்மைக்காக வாரம் ஒருமுறை உழைக்கும் இளைஞர்."],
["குழந்தைகள் நாம் சொல்வதை விட நாம் செய்வதைப் பார்த்துக் கற்கிறார்கள்.","பெரியோரை வணங்கும் தந்தையைப் பார்த்து மகனும் வணங்குதல்."],
["தேவையுள்ளவருக்கு உதவுவது இறைவனுக்குச் செய்யும் சேவைக்குச் சமம்.","மழையில் தவித்த குடும்பத்துக்கு இடம் தந்தவர்."],
["மதங்களின் வழிகள் வேறானாலும் அன்பு, கருணை என்ற சாரம் ஒன்றே.","வேறு மதத்தாரின் விழாவிலும் அன்புடன் கலந்து கொள்ளுதல்."],
["உண்மையான அறிவு மனதின் அழுக்கை நீக்கி தூய்மையாக்கும்.","தவறான நம்பிக்கையை அறிவால் கண்டுணர்ந்து விட்டவன்."],
["கற்றல் வாழ்நாள் முழுதும் தொடரும் பயணம்.","எழுபது வயதில் கணினி கற்றுக்கொண்ட தாத்தா."],
["உடல் அழிந்தாலும் உள்ளிருக்கும் ஆன்மா அழியாதது என கீதை கூறுகிறது; இது இழப்பின் துயரைத் தணிக்கும்.","அன்பானவரை இழந்தவர் இதை நினைத்து மனம் தேறுதல்."],
["வயது, தோற்றம் மாறினாலும் நமது உண்மை இயல்பு மாறாது.","வயதான பின்னும் குழந்தைத்தனமான அன்பை இழக்காதவர்."],
["தேடும் மனதுக்கு வழிகாட்டும் ஆசான் கிடைப்பார்.","வாழ்வில் குழப்பத்தில் இருந்தவனுக்கு ஒரு நல்ல ஆசிரியர் தெளிவு தந்தார்."],
["கேள்வி எழுப்பும் மனம்தான் ஆழமாக அறிந்துகொள்ளும்.","‘இது ஏன்?’ என்று கேட்ட மாணவன் பாடத்தை நன்கு புரிந்துகொண்டான்."],
["அறியாமையால் தவறான முடிவுகளும் பயமும் பிறந்து துன்பம் தருகின்றன.","பாம்பு எனத் தவறாக நினைத்து கயிற்றைக் கண்டு பயந்தவன்."],
["அறிவு பெருகப் பெருக பணிவும் பெருக வேண்டும்.","பெரிய அறிஞர் சிறுவனிடமும் கற்றுக்கொள்ளத் தயங்காதது."],
["படித்ததை நடைமுறையில் கடைப்பிடிப்பதே கல்வியின் பயன்.","நேர்மை பற்றி படித்தவன் தேர்வில் நகல் அடிக்க மறுத்தான்."],
["தற்காலிகமானவற்றில் அதிகம் ஆசை வைக்காமல் நிலையானவற்றைத் தேடு.","புகழ், பணத்தை விட நல்ல குணமே நிலைக்கும் என உணர்தல்."],
["அறிவு குழப்பமெனும் இருளைப் போக்கும் ஒளி.","சட்டம் தெரிந்தவன் தவறான ஒப்பந்தத்தில் கையெழுத்திடாமல் தப்பினான்."],
["தெரியாது என ஒப்புக்கொண்டால்தான் புதிதாகக் கற்க முடியும்.","தெரியாததைக் கேட்டு பிழையின்றி வேலை செய்த பணியாளர்."],
["நல்ல நூல்கள் நமக்குப் பல ஆண்டு அனுபவங்களைச் சுருக்கித் தரும்.","புத்தகம் படித்து பணத்தை நிர்வகிக்கக் கற்றவர்."],
["பதில்கள் வெளியில் மட்டுமில்லை; ஆழ்ந்து சிந்தித்தால் உள்ளும் கிடைக்கும்.","தனிமையில் யோசித்து வாழ்க்கை இலக்கைத் தெளிவுபடுத்தியவர்."],
["பணிவு மனதைத் திறந்து வைப்பதால் அறிவு எளிதில் புகும்.","குருவை மதித்துக் கற்றதால் இசையில் உயர்ந்த மாணவன்."],
["வெளித் தோற்றத்தை நம்பாமல் உண்மையை ஆராய்ந்து அறிய வேண்டும்.","அழகிய விளம்பரத்தை நம்பாமல் பொருளின் தரத்தைச் சோதித்தவர்."],
["பிறர் பேச்சை கவனித்துக் கேட்பவன் அதிகம் தெரிந்துகொள்கிறான்.","பெரியவர்களின் அனுபவக் கதைகளைக் கேட்டு வாழ்க்கைப் பாடம் பெற்றவன்."],
["அனுபவம் தரும் பாடம் புத்தகத்தால் கிடைக்காத ஆழம் கொண்டது.","ஒரு முறை ஏமாந்தபின் எச்சரிக்கையாக இருக்கக் கற்றவர்."],
["அறிவைப் பகிர்வதால் குறையாது; கற்றுத் தருபவரும் ஆழ்ந்து அறிவார்.","தான் கற்ற கணிதத்தை அண்டை வீட்டுக் குழந்தைகளுக்குச் சொல்லிக் கொடுத்தல்."],
["புரிதலிலிருந்து தெளிவு பிறக்கும்; தெளிவு மன அமைதியைத் தரும்.","பிரச்சினையின் காரணத்தை அறிந்ததும் மனம் அமைதியடைந்தது."],
["வெற்றியில் கர்வமும் தோல்வியில் சோர்வும் கொள்ளாமல் நிதானமாக இருப்பது சமநிலை.","போட்டியில் வென்றும் தோற்றும் அடுத்த பயிற்சிக்குத் தயாரான வீரர்."],
["முடிவை அதிகம் எதிர்பார்த்து பதறினால் செய்யும் செயலின் தரம் குறையும்.","முடிவைப் பற்றியே யோசித்ததால் கவனம் சிதறி தவறு செய்தவன்."],
["தோல்வி நம் குறையைக் காட்டி அடுத்த முறை சரிசெய்ய உதவும் ஆசான்.","தேர்வில் தவறிய கணக்குகளைத் திருத்தி அடுத்த முறை வென்ற மாணவன்."],
["இன்பமும் துன்பமும் மாறி மாறி வரும்; அவற்றைப் பொறுமையாகக் கடக்க வேண்டும்.","குளிர் காலம் போல கஷ்ட காலமும் கடந்து போகும்."],
["விதைத்து நீர் ஊற்றுவது உழவன் வேலை; விளைச்சல் இயற்கையின் காலத்தில் வரும்.","பயிற்சி செய்யும் வீரன் உடனே பதக்கம் எதிர்பார்க்கக் கூடாது."],
["முயற்சியில் கற்றதும் வளர்ந்ததுமே நிரந்தரச் செல்வம்.","தேர்வு மதிப்பெண்ணை விட படிக்கும்போது பெற்ற அறிவு பயன் தரும்."],
["பலன்மீதுள்ள பேராசையை விட்டு, பணியை உற்சாகமாகத் தொடர வேண்டும்.","வெற்றியைப் பற்றி கவலைப்படாமல் தினமும் பயிற்சி செய்பவன்."],
["அதிக எதிர்பார்ப்பு இருந்தால்தான் பெரிய ஏமாற்றம் வருகிறது.","நல்ல முயற்சி செய்து எது வந்தாலும் ஏற்றுக்கொள்ளும் மனப்பாங்கு."],
["நல்ல செயல்கள் நமக்கே ஆதரவையும் மன நிம்மதியையும் திருப்பித் தரும்.","கடினமான நேரத்தில் முன்பு உதவியவருக்கு பிறர் உதவ முன்வந்தனர்."],
["நாம் செய்யும் செயலின் விளைவை நாமே அனுபவிக்கிறோம்.","மற்றவருக்கு நல்லது செய்தவர் நல்லெண்ணம் பெறுகிறார்."],
["தடைகள் நம்மைச் சோர்வடையச் செய்வதற்கல்ல, வலிமைப்படுத்தவே வருகின்றன.","பல முறை நிராகரிக்கப்பட்டும் முயன்ற நடிகர் இறுதியில் வெற்றி பெற்றார்."],
["கீழே விழுவது தவறல்ல; மீண்டும் எழுவதே வீரம்.","தொழிலில் நஷ்டப்பட்டு மீண்டும் தொடங்கிய வியாபாரி."],
["நேர்மையின்றி வந்த வெற்றி நிலைக்காது; நியாயமான வெற்றி மதிப்பைத் தரும்.","மோசடி இல்லாமல் உழைத்து முன்னேறிய வணிகர்."],
["பாராட்டிலும் விமர்சனத்திலும் நிதானமாக இருந்தால் மனம் சீராக இருக்கும்.","விமர்சனத்தைக் கேட்டு திருத்தி, புகழைக் கேட்டு செருக்கு கொள்ளாதவர்."],
["சரியான திசையில் மெதுவாகச் சென்றாலும் இலக்கை அடையலாம்.","தவறான பாதையில் வேகமாகச் செல்வதை விட சரியான படிப்பைத் தேர்ந்தெடுத்தல்."],
["தினசரி சிறு முயற்சிகள் காலப்போக்கில் பெரும் சாதனையாகும்.","தினமும் சிறு தொகை சேமித்து பெரிய சேமிப்பை உருவாக்கியவர்."],
["நடப்பதில் ஏதோ நன்மை இருக்கலாம் என்ற நம்பிக்கை கவலையைக் குறைக்கும்.","வேலை இழந்து புதிய தொழில் தொடங்கி முன்னேறியவர்."],
["சில விஷயங்கள் காலத்தால் கனிகின்றன; பொறுமை அவசியம்.","மரம் நட்டு பழம் வருவதற்குக் காத்திருக்கும் தோட்டக்காரர்."],
["திட்டமும் நோக்கமும் தெளிவாக இருந்தால் செயல்பட மனம் தயங்காது.","பாதை தெரிந்தவன் தயக்கமில்லாமல் பயணம் தொடங்குகிறான்."],
["ஒவ்வொரு காலையும் கடந்த தவறுகளை விட்டு புதிதாகத் தொடங்கும் வாய்ப்பு.","நேற்றைய தோல்வியை மறந்து இன்று மீண்டும் பயிற்சி தொடங்கும் வீரன்."],
["மன அமைதி இருந்தால் எதுவும் குறையாது; அது பணத்தை விட மதிப்பு வாய்ந்தது.","சிறிய வீட்டிலும் நிம்மதியாக வாழ்பவர் செல்வந்தரை விட மகிழ்ச்சியாக இருக்கிறார்."],
["அமைதி இல்லாத மனம் பெற்றதையும் அனுபவிக்க முடியாது.","பதற்றமாக இருந்ததால் விடுமுறையிலும் மகிழ முடியாதவர்."],
["சூழ்நிலை கொந்தளித்தாலும் உள்ளம் நிலைகுலையாமல் இருப்பது வலிமை.","அலுவலகக் குழப்பத்திலும் அமைதியாகத் தீர்வு தேடிய மேலாளர்."],
["சில சமயம் பேசாமல் இருப்பது சண்டையைத் தவிர்க்கும் சிறந்த வழி.","வாக்குவாதத்தின்போது அமைதியாக இருந்து பின்னர் தெளிவாகப் பேசியவர்."],
["பதற்றம் தவறுகளுக்கு வழி வகுக்கும்; பொறுமை சிந்திக்க நேரம் தரும்.","அவசரமாகப் படிவம் நிரப்பி பிழை செய்தவன்."],
["தேவைகளைக் குறைத்தால் ஏக்கமும் மன அழுத்தமும் குறையும்.","தேவையற்ற பொருட்களை வாங்காமல் நிம்மதியாக இருக்கும் குடும்பம்."],
["தனிமையில் சிந்தித்தால் நம் உண்மையான எண்ணங்களை அறிய முடியும்.","தினமும் மாலையில் அமைதியாக அமர்ந்து நாளை மதிப்பிடுதல்."],
["ஆழ்ந்த மூச்சு உடலைத் தளர்த்தி கோபத்தைக் குறைக்கும்.","கோபம் வரும்போது பத்து எண்ணி மூச்சு விட்டுப் பேசுதல்."],
["போதும் என்ற திருப்தி மனதுக்கு மிகப் பெரிய மருந்து.","கிடைத்த வருமானத்தில் நிறைவாக வாழும் தம்பதியர்."],
["வெளி இரைச்சலும் எண்ணங்களின் இரைச்சலும் குறைந்தால் உள்ளுணர்வு தெளிவாகும்.","கைபேசியை அணைத்து நடந்தபோது புதிய யோசனை தோன்றியவர்."],
["பயனற்ற விவாதங்கள் நேரத்தையும் மன அமைதியையும் கெடுக்கும்.","அரசியல் வாதங்களில் வீணாகச் சண்டையிடாமல் விலகியவர்."],
["அமைதியாக இருப்பது திறமையின்மை அல்ல; கட்டுப்பாட்டின் அடையாளம்.","தூண்டுதலுக்கு எதிர்வினை செய்யாத சக ஊழியர்."],
["இயற்கையோடு இருப்பது மன இறுக்கத்தைத் தளர்த்தும்.","மாலை நேரத்தில் பூங்காவில் நடந்து மனச்சோர்வு நீங்கியவர்."],
["நடந்தது கடந்து போனது; நிகழ்காலமே நம் கையில் உள்ளது.","உணவு உண்ணும்போது வேலை பற்றி நினைக்காமல் சுவையை அனுபவித்தல்."],
["நேர்மையாக வாழ்பவருக்கு குற்றவுணர்வு இல்லாததால் நிம்மதியான தூக்கம் கிடைக்கும்.","தவறு செய்யாமல் வாழ்ந்த கடைக்காரர் நிம்மதியாக உறங்குதல்."],
["ஆடம்பரம் குறைந்த வாழ்வில் கவலைகளும் குறைவு.","எளிய வாழ்க்கை வாழ்ந்தாலும் மகிழ்ச்சியாக இருந்த ஆசிரியர்."],
["பிறர் பேசும் கடுஞ்சொல்லை ஏற்பதும் விடுவதும் நம் தேர்வு.","அவமதிப்பைப் புறக்கணித்து தன் வேலையில் கவனம் செலுத்தியவர்."],
["பதற்றம் இல்லாமல் ஆராய்ந்தால் சிக்கலுக்குத் தீர்வு தெளிவாகும்.","கணினி பழுதடைந்தபோது அமைதியாகப் படிப்படியாகச் சரி செய்தவர்."],
["கலங்கிய நீரில் முகம் தெரியாது; தெளிந்த மனத்தில் உண்மை தெரியும்.","தியானத்துக்குப் பின் தெளிவான முடிவு எடுத்தவர்."],
["அமைதியான மனமே ஆன்மிக வளர்ச்சிக்கு முதல் படி.","தினமும் அமைதியாக அமர்ந்து ஜபம் செய்து மனம் மென்மையானவர்."],
["இறைவனும் நம்பிக்கையும் துணையாக இருக்கும்போது அச்சத்துக்கு இடமில்லை.","இரவில் தனியாகப் பயணம் செய்தும் பிரார்த்தனை தைரியம் தந்தது."],
["உறுதியான நம்பிக்கை பெரிய தடையையும் சிறியதாக்கும்.","மலை ஏறும் முன் ‘முடியும்’ என நம்பி வெற்றி பெற்றவர்."],
["தேவையற்ற சந்தேகம் முயற்சியையும் உறவையும் பாதிக்கும்.","தன் திறமையை சந்தேகித்து வாய்ப்பை இழந்த இளைஞன்."],
["துணிந்து முயற்சி எடுப்பவனே வெற்றியின் முதல் படியை எட்டுகிறான்.","புதிய தொழில் தொடங்கத் துணிந்து முன்வந்தவர்."],
["துன்ப இருள் நிரந்தரமல்ல; நம்பிக்கையுடன் பொறுத்தால் ஒளி வரும்.","நீண்ட வேலையின்மைக்குப் பின் நல்ல வேலை கிடைத்தது."],
["நமக்குள் உள்ள ஆற்றலை நம்பாவிட்டால் வாய்ப்புகளும் வீணாகும்.","மேடையில் பேச பயந்தவர் பயிற்சியால் சிறந்த பேச்சாளரானார்."],
["விடாமுயற்சி உள்ளவன் ஒவ்வொரு தோல்வியிலும் கற்றுக்கொள்கிறான்.","பல முறை முயன்று அரசுத் தேர்வில் வென்றவர்."],
["பயம் பெரும்பாலும் நம் கற்பனையில் பெரிதாகிறது; உண்மையில் சிறியது.","மேடையில் பேசும் பயம் தொடங்கியபின் குறைந்தது."],
["சவால்கள் நம் திறமைகளை வெளிக்கொணர்ந்து நம்மை மெருகேற்றுகின்றன.","கடினமான பணியால் புதிய திறன்களைக் கற்றவர்."],
["உறுதியான மன நிலை சிரமமான இலக்கையும் அடையச் செய்யும்.","தினமும் அதிகாலை எழுந்து பயிற்சி செய்த வீரர்."],
["நெருக்கடியில் பதறாமல் சிந்தித்தால் சிறந்த வழி தெரியும்.","தீ விபத்தில் பதறாமல் மக்களை வெளியேற்றிய காவலர்."],
["முழு வழியும் தெரியாவிட்டாலும் தொடங்கினால் வழி வெளிப்படும்.","முதல் பக்கம் எழுதியதும் கதை தானாக வளர்ந்தது."],
["கடமையைச் செய்ய தயக்கம் இன்றி எழுந்து நிற்க வேண்டும்.","அநீதியைக் கண்டு குரல் கொடுத்த இளைஞன்."],
["நம் கனவு மதிப்புள்ளது; பிறர் கேலிக்காக அதை விடக் கூடாது.","கேலிக்கு அஞ்சாமல் இசைப் பயிற்சி தொடர்ந்தவர்."],
["தோல்வி முயற்சியின் ஒரு பகுதி; மீண்டும் முயன்றால் பாதை திறக்கும்.","முதல் தொழில் தோல்வியடைந்தும் புதிய திட்டத்துடன் திரும்பியவர்."],
["நம்பிக்கை இருள் சூழ்ந்த நேரத்திலும் வழி காட்டும் விளக்கு.","நோயாளிக்கு குணமடையும் நம்பிக்கை மன வலிமை தந்தது."],
["இறைவனிடம் வைக்கும் நம்பிக்கை மனதுக்கு பாதுகாப்பு உணர்வைத் தரும்.","கடினமான நேரத்தில் பிரார்த்தனை மனதைத் தாங்கியது."],
["பயம் இருந்தும் சரியான செயலைச் செய்வதே உண்மையான தைரியம்.","பயந்தாலும் பிறருக்காக ஆபத்தில் உதவச் சென்ற மனிதர்."],
["உறுதியுடன் முயற்சிப்பவனுக்கு சூழ்நிலைகளும் உதவ முன்வரும்.","விடாமல் முயன்ற மாணவனுக்கு ஆசிரியர்களும் உதவினர்."],
["வரும் நாளை பயத்தால் அல்ல, நம்பிக்கையுடன் திட்டமிட்டு சந்திக்க வேண்டும்.","புதிய ஊருக்குச் செல்லும்போது நன்மையை எதிர்பார்த்துத் தயாராதல்."],
["நேர்மையைக் கடைப்பிடிப்பது நம்மைக் காக்கும்; தவறான வழி இறுதியில் அழிக்கும்.","நியாயமாக வணிகம் செய்தவர் சிக்கலில் மக்கள் ஆதரவு பெற்றார்."],
["உண்மை பேசுவதற்கு துணிவு தேவை; அது தவத்துக்கு நிகரான ஒழுக்கம்.","நஷ்டம் வந்தாலும் உண்மையைச் சொன்ன வியாபாரி."],
["நேர்மையானவருக்கு ரகசியங்களோ பயமோ இல்லை.","கணக்கை எப்போதும் சரியாக வைத்திருப்பவர் ஆய்வுக்கு அஞ்சுவதில்லை."],
["தவறு நடக்கும்போது அமைதியாக இருந்தால் அதற்கு நாமும் துணை போகிறோம்.","சக மாணவனைத் துன்புறுத்தியவரை ஆசிரியரிடம் தெரிவித்தவன்."],
["நியாயத்தின் பக்கம் நின்றால் நல்லவர்களின் ஆதரவு கிடைக்கும்.","ஒருவருக்காகக் குரல் கொடுத்தபோது ஊர் மக்கள் ஒன்று சேர்ந்தனர்."],
["பேராசை மனிதனை நேர்மை தவறச் செய்து அழிவுக்கு இட்டுச் செல்கிறது.","அதிக லாபத்துக்கு ஆசைப்பட்டு மோசடியில் சிக்கிய வணிகர்."],
["பிறருக்குச் சொந்தமானவற்றை விரும்புவது பொறாமையையும் தவறையும் வளர்க்கும்.","அண்டை வீட்டார் செல்வத்தைப் பார்த்து ஏங்காமல் தன் உழைப்பை நம்பியவர்."],
["தானம் சுயநலத்தைக் குறைத்து செல்வத்துக்கு நல்ல பயனை அளிக்கிறது.","தன் வருமானத்தில் ஒரு பகுதியை கல்விக்கு வழங்கியவர்."],
["சொன்ன சொல்லைக் காப்பாற்றுவது நம்பிக்கையின் அடிப்படை.","குறித்த நேரத்தில் வருவதாகச் சொல்லி சரியாக வந்த நண்பர்."],
["நல்லவர்களைக் காக்க அநீதியை எதிர்க்கும் தைரியமும் வலிமையும் வேண்டும்.","பலவீனரைக் காக்க முன்வந்த காவலர்."],
["தன் நலனை மட்டுமே பார்க்காமல் சமூக நலனையும் எண்ணுவது தர்மம்.","தன் வசதியை விட ஊருக்குத் தண்ணீர் வசதி செய்தவர்."],
["செய்வதற்கு முன் ‘இது சரியா?’ என்று கேட்பது தவறுகளைத் தடுக்கும்.","லஞ்சம் கொடுக்க நினைத்தும் மனசாட்சியின் குரலால் நிறுத்தியவர்."],
["ஒரு பொய்யை மறைக்க பல பொய்கள் தேவையாகி மன அழுத்தம் கூடும்.","தேர்வு மதிப்பெண் பற்றிப் பொய் சொல்லிப் பயந்த மாணவன்."],
["உயர் பதவி வந்தால் அதைச் சரியாகப் பயன்படுத்தும் பொறுப்பும் வருகிறது.","அதிகாரி தன் பதவியை மக்கள் நலனுக்காகப் பயன்படுத்துதல்."],
["நேர்மையாகச் சம்பாதித்த பணம் நிம்மதியையும் நிலைப்பையும் தரும்.","கஷ்டப்பட்டுச் சேர்த்த பணத்தில் வீடு கட்டியவர்."],
["மற்றவரை ஏமாற்றுவதால் நம் நற்பெயரையும் நம்பிக்கையையும் இழக்கிறோம்.","தரமில்லாப் பொருளை விற்ற கடையின் வாடிக்கையாளர்கள் குறைந்தனர்."],
["நியாயமான ஆட்சி மக்களின் நம்பிக்கையால் நிலைக்கும்.","எல்லோரையும் சமமாக நடத்திய தலைவன் மக்களின் மதிப்பைப் பெற்றார்."],
["தவறை ஒப்புக்கொண்டு திருத்த மன வலிமை தேவை.","தன் தவறால் நஷ்டம் வந்ததை ஒப்புக்கொண்டு பொறுப்பேற்ற மேலாளர்."],
["நல்ல நடத்தை எவராலும் பறிக்க முடியாத செல்வம்.","பணம் இல்லாவிட்டாலும் நற்பெயருக்காக மதிக்கப்படுபவர்."],
["சிரமமாக இருந்தாலும் நியாயத்தின் பக்கம் உறுதியாக நிற்க வேண்டும்.","நண்பன் தவறு செய்தாலும் உண்மையைச் சொன்னவன்."],
["வாழ்வின் ஒவ்வொரு அனுபவமும் கற்றுக்கொள்ள வாய்ப்பு.","தோல்வியடைந்த பயணத்தில் புதிய நண்பரைப் பெற்றவர்."],
["எல்லாம் மாறிக் கொண்டே இருக்கும்; மாற்றத்தை ஏற்கத் தயாராக இருக்க வேண்டும்.","புதிய தொழில்நுட்பத்தைக் கற்று வேலையில் நிலைத்தவர்."],
["நேற்றும் நாளையும் அல்ல; இன்றே நம் கையில் உள்ளது.","இன்று குடும்பத்துடன் நேரம் செலவிடுதல்."],
["பிறப்பு இறப்பு இயற்கையின் சுழற்சி என்று உணர்ந்தால் அச்சம் குறையும்.","இலை உதிர்ந்து புதிய இலை தளிர்ப்பது போல."],
["இன்பமும் துன்பமும் நிலையற்றவை என்ற நினைவு பொறுமை தரும்.","கடுமையான காலம் கடந்து மகிழ்ச்சி மீண்டும் வந்தது."],
["இருப்பதில் மகிழ்பவன் மன நிறைவுடன் வாழ்வான்.","சிறிய வீட்டிலும் நன்றியுடன் வாழும் குடும்பம்."],
["நேரம் ஒருமுறை சென்றால் திரும்பாது; அதை நல்ல பணிக்குப் பயன்படுத்த வேண்டும்.","தினசரி படிப்புக்கு நேரம் ஒதுக்கி முன்னேறிய மாணவன்."],
["நல்ல துணையுடன் பயணம் செய்தால் வாழ்க்கைப் பாதை எளிதாகும்.","நல்ல நண்பர்களால் தீய பழக்கத்தை விட்டவர்."],
["வேலை, ஓய்வு, குடும்பம், ஆன்மிகம் ஆகியவற்றை சமமாகக் கவனிப்பது சமநிலை.","அலுவலகத்துடன் உடற்பயிற்சிக்கும் நேரம் ஒதுக்குபவர்."],
["உடல் நலத்தைக் காப்பது ஆன்மிகப் பயணத்துக்கும் அவசியம்.","தினமும் நடந்து, நல்ல உணவு உண்டு ஆரோக்கியம் காப்பவர்."],
["எளிய உணவும் தூய சிந்தனையும் உடலுக்கும் மனதுக்கும் நலம்.","காய்கறி, பருப்பு சாதம் உண்டு சுறுசுறுப்பாக இருக்கும் முதியவர்."],
["தவறுகளிலிருந்து பாடம் கற்று முன்னேறுவது புத்திசாலித்தனம்.","கடந்த முறை செய்த பிழையை மீண்டும் செய்யாத மாணவன்."],
["இயற்கையைப் பாதுகாப்பது இறைவனின் படைப்புக்குச் செய்யும் மரியாதை.","வீட்டருகே மரம் நட்டு நீர் ஊற்றுபவர்."],
["மகிழ்ச்சி பொருட்களில் அல்ல, நம் மனநிலையில் இருக்கிறது.","எளிய உணவிலும் குடும்பத்துடன் இருப்பதில் மகிழ்ந்தவர்."],
["நல்லவற்றைக் கவனித்தால் வாழ்வில் நன்றியும் நம்பிக்கையும் வளரும்.","தினமும் மூன்று நன்மைகளைக் குறித்து வைக்கும் பழக்கம்."],
["நம் உண்மை இயல்பையும் நோக்கத்தையும் அறிவதே வாழ்வின் பயன்.","தனக்குப் பிடித்த சேவைப் பணியைக் கண்டுபிடித்த இளைஞர்."],
["ஒன்று முடிந்தால் வேறொன்று தொடங்குகிறது; எனவே முடிவுக்கு அஞ்ச வேண்டாம்.","பள்ளி முடிந்து கல்லூரி வாழ்க்கை தொடங்குவது போல."],
["பிறருக்காகச் செய்யும் சேவை நம் வாழ்வுக்குப் பொருளை அளிக்கிறது.","முதியோர் இல்லத்தில் உதவி செய்து மன நிறைவு பெற்றவர்."],
["அன்பு, அறம், அமைதி மூன்றும் சேர்ந்த வாழ்வு நிறைவானது.","குடும்பத்தில் அன்பு காட்டி, நேர்மையாக உழைத்து, அமைதியாக வாழ்பவர்."],
["இறைவன் துணை உண்டு என்ற நம்பிக்கையுடன் முயன்றால் வெற்றி கிட்டும்.","கடினமான இலக்கிலும் பிரார்த்தனையுடனும் உழைப்புடனும் வென்றவர்."]
];

/* ---------- நிலை ---------- */
const ALL = [];
DATA.forEach((c, ci) => c.s.forEach(t => {
  const e = EXPL[ALL.length] || ["", ""];
  ALL.push({ id: ALL.length + 1, cat: ci, text: t, ex: e[0], eg: e[1] });
}));
if (EXPL.length !== ALL.length) console.warn("விளக்கங்களின் எண்ணிக்கை பொருந்தவில்லை:", EXPL.length, ALL.length);

const $ = id => document.getElementById(id);
const grid = $("grid"), chipsBox = $("chips");
let current = 0;            // index in ALL
let catFilter = -1;         // -1 = all, -2 = favourites
let query = "";
let favs = new Set();

/* localStorage may be blocked – always guard it */
try { favs = new Set(JSON.parse(localStorage.getItem("kp200_favs") || "[]")); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem("kp200_favs", JSON.stringify([...favs])); } catch (e) {} };

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600);
}

/* ---------- ஹீரோ ---------- */
function showHero(i, animate = true){
  current = (i + ALL.length) % ALL.length;
  const s = ALL[current];
  $("meta").textContent = `பொன்மொழி ${s.id} / ${ALL.length} • ${DATA[s.cat].n}`;
  const tx = $("text");
  tx.textContent = s.text;
  $("vilakkam").textContent = s.ex;
  $("udharanam").textContent = s.eg;
  if (animate){ tx.classList.remove("swap"); void tx.offsetWidth; tx.classList.add("swap"); }
  $("heroFav").setAttribute("aria-pressed", favs.has(s.id));
  document.querySelectorAll(".item").forEach(el =>
    el.classList.toggle("active", Number(el.dataset.id) === s.id));
}

/* ---------- பட்டியல் ---------- */
function toggleFav(id){
  favs.has(id) ? favs.delete(id) : favs.add(id);
  saveFavs();
  renderChips();
  render();
  showHero(current, false);
}

function render(){
  const q = query.trim().toLowerCase();
  const list = ALL.filter(s =>
    (catFilter === -1 || (catFilter === -2 ? favs.has(s.id) : s.cat === catFilter)) &&
    (!q || (s.text + " " + s.ex + " " + s.eg).toLowerCase().includes(q) || String(s.id) === q));
  grid.textContent = "";
  const frag = document.createDocumentFragment();
  list.forEach(s => {
    const li = document.createElement("li");
    li.className = "item" + (s.id === ALL[current].id ? " active" : "");
    li.dataset.id = s.id;
    li.tabIndex = 0;

    const head = document.createElement("div");
    head.className = "no";
    const a = document.createElement("span"); a.textContent = "பொன்மொழி " + s.id;
    const b = document.createElement("span"); b.textContent = DATA[s.cat].n;
    head.append(a, b);

    const p = document.createElement("p"); p.textContent = s.text;

    const fav = document.createElement("button");
    fav.className = "fav"; fav.type = "button"; fav.textContent = "♥";
    fav.setAttribute("aria-label", "பிடித்தவையில் சேர்");
    fav.setAttribute("aria-pressed", favs.has(s.id));
    fav.style.alignSelf = "flex-end";
    fav.addEventListener("click", e => { e.stopPropagation(); toggleFav(s.id); });

    const det = document.createElement("details");
    det.className = "more";
    const sm = document.createElement("summary"); sm.textContent = "விளக்கம் & உதாரணம்";
    const h1 = document.createElement("h3"); h1.textContent = "விளக்கம்";
    const p1 = document.createElement("p"); p1.textContent = s.ex;
    const h2 = document.createElement("h3"); h2.textContent = "உதாரணம்";
    const p2 = document.createElement("p"); p2.textContent = s.eg;
    det.append(sm, h1, p1, h2, p2);
    det.addEventListener("click", e => e.stopPropagation());
    det.addEventListener("keydown", e => e.stopPropagation());

    li.append(head, p, det, fav);
    const open = () => { showHero(s.id - 1); window.scrollTo({ top: 0, behavior: "smooth" }); };
    li.addEventListener("click", open);
    li.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
    frag.appendChild(li);
  });
  grid.appendChild(frag);
  $("empty").hidden = list.length > 0;
  $("count").textContent = `${list.length} பொன்மொழிகள் காட்டப்படுகின்றன`;
}

function renderChips(){
  chipsBox.textContent = "";
  const defs = [{ v: -1, t: `அனைத்தும் (${ALL.length})` }]
    .concat(DATA.map((c, i) => ({ v: i, t: c.n })))
    .concat([{ v: -2, t: `♥ பிடித்தவை (${favs.size})` }]);
  defs.forEach(d => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = d.t;
    b.setAttribute("aria-pressed", catFilter === d.v);
    b.addEventListener("click", () => { catFilter = d.v; renderChips(); render(); });
    chipsBox.appendChild(b);
  });
}

/* ---------- நிகழ்வுகள் ---------- */
$("prev").onclick = () => showHero(current - 1);
$("next").onclick = () => showHero(current + 1);
$("rand").onclick = () => {
  let n; do { n = Math.floor(Math.random() * ALL.length); } while (n === current);
  showHero(n);
};
$("heroFav").onclick = () => toggleFav(ALL[current].id);
$("search").addEventListener("input", e => { query = e.target.value; render(); });

function shareText(){
  const s = ALL[current];
  return `“${s.text}”\n\nவிளக்கம்: ${s.ex}\nஉதாரணம்: ${s.eg}\n\n— கிருஷ்ணர் பொன்மொழிகள் (${s.id}/200)\nசுந்தரராஜு ஆன்மிகக் கற்றல் உலகம்`;
}
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(shareText()); toast("நகலெடுக்கப்பட்டது"); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = shareText();
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("நகலெடுக்கப்பட்டது"); } catch (_) { toast("நகலெடுக்க இயலவில்லை"); }
    ta.remove();
  }
};
$("share").onclick = async () => {
  if (navigator.share){ try { await navigator.share({ text: shareText() }); } catch (e) {} }
  else $("copy").click();
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") showHero(current + 1);
  if (e.key === "ArrowLeft") showHero(current - 1);
});

/* தீம் */
const root = document.documentElement;
try { const t = localStorage.getItem("kp200_theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("themeBtn").onclick = () => {
  const next = root.dataset.theme === "light" ? "dark" : "light";
  root.dataset.theme = next;
  try { localStorage.setItem("kp200_theme", next); } catch (e) {}
};

/* ---------- தொடக்கம்: இன்றைய பொன்மொழி ---------- */
const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 864e5);
renderChips();
render();
showHero(dayOfYear % ALL.length, false);
</script>
</body>
</html>
