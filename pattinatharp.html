<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>பட்டினத்தார் பாடல்கள் – விளக்கத்துடன்</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;600;800&family=Mukta+Malar:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --leaf: #dfe2d0;      /* palm-leaf */
    --leaf-dark: #c9cdb5;
    --ink: #1d2a21;       /* writing ink */
    --ash: #6b6f66;
    --ember: #b9650a;     /* sacred fire */
    --paper: #f3f4ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--leaf); color: var(--ink);
    font-family: "Mukta Malar", "Noto Serif Tamil", sans-serif; line-height: 1.8;
  }
  header { padding: 40px 20px 20px; text-align: center; }
  header h1 { font-family: "Noto Serif Tamil", serif; font-weight: 800; font-size: clamp(1.8rem, 5vw, 3rem); margin: 0; }
  header p { margin: 8px 0 0; color: var(--ash); }

  main { max-width: 860px; margin: 0 auto; padding: 0 16px 60px; }

  .picker { margin: 16px 0 24px; }
  .picker input {
    width: 100%; font: inherit; padding: 10px 14px; border: 1.5px solid var(--ink);
    background: var(--paper); color: var(--ink); border-radius: 6px;
  }
  .list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 220px; overflow-y: auto; background: var(--paper); border: 1.5px solid var(--leaf-dark); }
  .list button {
    display: block; width: 100%; text-align: left; font: inherit; padding: 6px 14px;
    border: 0; border-bottom: 1px solid var(--leaf-dark); background: transparent; color: var(--ink); cursor: pointer;
  }
  .list button[aria-selected="true"] { background: var(--ink); color: var(--leaf); }
  button:focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }

  /* the song sits on a palm-leaf strip */
  .leaf {
    background: var(--paper); border-top: 6px solid var(--leaf-dark); border-bottom: 6px solid var(--leaf-dark);
    padding: 32px 24px; text-align: center; box-shadow: 0 2px 0 rgba(0,0,0,.08);
  }
  .leaf h2 { font-family: "Noto Serif Tamil", serif; font-size: 1.1rem; font-weight: 600; color: var(--ember); margin: 0 0 16px; }
  .verse { font-family: "Noto Serif Tamil", serif; font-size: var(--size, 1.6rem); line-height: 2.1; margin: 0; }
  .verse span { display: block; transition: color .3s; }
  .verse.long span { font-size: .72em; line-height: 1.9; }
  .verse span.active { color: var(--ember); }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0; }
  .tools button {
    font: inherit; padding: 8px 16px; border: 1.5px solid var(--ember); color: var(--ember);
    background: transparent; border-radius: 6px; cursor: pointer;
  }
  .tools button:hover { background: var(--ember); color: #fff; }

  .explain { background: var(--paper); border-left: 5px solid var(--ember); padding: 4px 22px 18px; margin-top: 8px; }
  .explain[hidden] { display: none; }
  .explain h3 { font-family: "Noto Serif Tamil", serif; margin: 18px 0 4px; font-size: 1.05rem; }
  .explain p, .explain li { margin: 4px 0; }
  .words { padding-left: 20px; }
  .words b { font-family: "Noto Serif Tamil", serif; }

  .note { color: var(--ash); font-size: .9rem; text-align: center; margin-top: 28px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>பட்டினத்தார் பாடல்கள்</h1>
  <p>பாடலும் விளக்கமும்</p>
</header>

<main>
  <div class="picker">
    <input id="search" type="search" placeholder="பாடலைத் தேடு…" aria-label="பாடலைத் தேடு">
    <ul id="list" class="list"></ul>
  </div>

  <section class="leaf" aria-live="polite">
    <h2 id="song-title"></h2>
    <p class="verse" id="verse"></p>
  </section>

  <div class="tools">
    <button id="btn-prev">« முந்தைய</button>
    <button id="btn-explain" aria-expanded="false">விளக்கம் காட்டு</button>
    <button id="btn-listen">பாடலைக் கேள்</button>
    <button id="btn-smaller" aria-label="எழுத்தைச் சிறிதாக்கு">அ−</button>
    <button id="btn-bigger" aria-label="எழுத்தைப் பெரிதாக்கு">அ+</button>
    <button id="btn-next">அடுத்த »</button>
  </div>

  <section class="explain" id="explain" hidden>
    <h3>பொருள் (விளக்கம்)</h3>
    <p id="meaning"></p>
    <h3>சொற்பொருள்</h3>
    <ul class="words" id="words"></ul>
    <h3>கருத்து</h3>
    <p id="message"></p>
    <h3>In English</h3>
    <p id="english"></p>
  </section>
  <p class="note">பாடல் மூலம்: சித்தர் பாடல்கள் – பட்டினத்தார் (Project Madurai மின்னூல்). விளக்கம் எளிய நடையில் எழுதப்பட்டது; ஆழ்ந்த ஆய்வுக்கு உரை நூல்களைப் பார்க்கவும்.</p>
</main>

    {
      book: "திருவேகம்பமாலை", title: "பிறக்கும் பொழுது கொடுவந்ததில்லை",
      lines: ["பிறக்கும்பொழுது கொடுவந்த தில்லை, பிறந்து மண்மேல்","இறக்கும்பொழுது கொடுபோவ தில்லை; இடைநடுவில்","குறிக்குமிச் செல்வஞ் சிவன் தந்ததென்று கொடுக்கறியாது","இறக்குங் குலாமருக் கென்சொல்லுவேன் ? கச்சியேகம்பனே !"],
      meaning: "பிறக்கும்போது எதையும் கொண்டு வரவில்லை; இறக்கும்போது எதையும் கொண்டு போவதுமில்லை. இடையில் சேரும் இந்தச் செல்வம் சிவன் தந்தது என்று உணர்ந்து பிறருக்குக் கொடுக்கத் தெரியாமல் மடியும் செல்வ அடிமைகளுக்கு என்ன சொல்வேன்?",
      words: [["குறிக்கும்","தேடிச் சேர்த்துக் கணக்கிடும்"],["குலாமர்","செல்வத்துக்கு அடிமையானவர்"]],
      message: "செல்வம் இறைவன் தந்தது; அதைப் பகிர்ந்து கொடுப்பதே சிறந்தது.",
      english: "We bring nothing at birth and take nothing at death; what can I say to those who die without sharing the wealth Shiva gave?"
    },
    {
      book: "திருவேகம்பமாலை", title: "கல்லாப் பிழையும் கருதாப் பிழையும்",
      lines: ["கல்லாப் பிழையும், கருதாப் பிழையும், கசிந்துருகி","நில்லாப் பிழையு நினையாப் பிழையும், நின்னஞ்செழுத்தைச்","சொல்லாப் பிழையுந், துதியாப் பிழையுந், தொழாப் பிழையும்","எல்லாப் பிழையும் பொறுத்தருள்வாய் கச்சியேகம்பனே."],
      meaning: "கற்காத பிழை, சிந்திக்காத பிழை, உள்ளம் உருகி நிற்காத பிழை, நினைக்காத பிழை, உன் ஐந்தெழுத்தை ஓதாத பிழை, துதிக்காத பிழை, தொழாத பிழை — என் எல்லாப் பிழைகளையும் பொறுத்தருள்வாய், கச்சி ஏகம்பனே.",
      words: [["கசிந்துருகி","மனம் நெகிழ்ந்து உருகி"],["அஞ்செழுத்து","நமசிவாய என்னும் ஐந்தெழுத்து"]],
      message: "குற்றங்களை ஏற்றுக்கொண்டு மன்னிப்பு வேண்டும் எளிய வேண்டுதல்.",
      english: "Forgive all my faults: not learning, not contemplating, not melting in devotion, not chanting your five letters, not praising or worshipping."
    },
    {
      book: "திருவேகம்பமாலை", title: "ஊருஞ் சதமல்ல",
      lines: ["ஊருஞ் சதமல்ல, உற்றார் சதமல்ல, உற்றுப்பெற்ற","பேருஞ் சதமல்ல, பெண்டீர் சதமல்ல, பிள்ளைகளும்","சீருஞ் சதமல்ல, செல்வஞ் சதமல்ல, தேசத்திலே","யாருஞ் சதமல்ல, நின்தாள் சதங்கச்சி யேகம்பனே."],
      meaning: "ஊர் நிலையானதல்ல; உறவினர் நிலையானவர் அல்லர்; பெற்ற புகழ், மனைவியர், பிள்ளைகள், சிறப்பு, செல்வம் எதுவும் நிலையல்ல; இந்த நாட்டில் யாரும் நிலையானவர் அல்லர். கச்சி ஏகம்பனே, உன் திருவடி ஒன்றே நிலையானது.",
      words: [["சதம்","நிலையானது"],["உற்றார்","உறவினர்"],["சீர்","சிறப்பு"]],
      message: "நிலையற்றவற்றை நம்பாமல் இறைவன் திருவடியையே பற்றுக் கோடாகக் கொள்ள வேண்டும்.",
      english: "Town, kin, fame, wives, children, honour, wealth - nothing is lasting; only your feet are."
    },
    {
      book: "திருவேகம்பமாலை", title: "கல்லார் சிவகதை",
      lines: ["கல்லார் சிவகதை, நல்லோர் தமக்குக் கனவிலும்மெய்","சொல்லார், பசித்தவர்க் கன்னங் கொடார், குருசொன்னபடி","நில்லார், அறத்தை நினையார், நின்நாமம் நினைவில்சற்றும்","இல்லா ரிருந்தென்? இறந்தென்? புகல், கச்சியேகம்பனே."],
      meaning: "சிவனின் கதைகளைக் கற்க மாட்டார்; நல்லவர்களிடம் கனவிலும் உண்மை சொல்ல மாட்டார்; பசித்தவருக்கு உணவு தர மாட்டார்; குரு சொன்னபடி நடக்க மாட்டார்; அறத்தை நினைக்க மாட்டார்; உன் திருநாமத்தைச் சிறிதும் நினைக்க மாட்டார். இத்தகையோர் இருந்தாலென்ன, இறந்தாலென்ன?",
      words: [["சிவகதை","சிவபெருமானின் புராணக் கதைகள்"],["அறம்","தர்மம், நல்லொழுக்கம்"]],
      message: "கற்றல், உண்மை, ஈகை, குருமொழி, நாமஸ்மரணை ஆகியவையே வாழ்வுக்குப் பொருள் தருகின்றன.",
      english: "Those who do not learn Shiva's stories, feed the hungry, speak truth, or ever remember your name - what difference does their living or dying make?"
    },
    {
      book: "திருவேகம்பமாலை", title: "நாறுமுடலை",
      lines: ["நாறுமுடலை, நரிப்பொதி சோற்றினை, நான்தினமுஞ்","சோறுங் கறியும்நிரப்பிய பாண்டத்தைத் தோகையர்தம்","கூறும்மலமும் இரத்தமுஞ் சோருங் குழியில்விழாது","ஏறும் படியருள்வாய் இறைவா, கச்சியேகம்பனே."],
      meaning: "நாற்றம் வீசும் உடல், நரிகளுக்கு உணவாகும் மூட்டை, நான் தினமும் சோறும் கறியும் நிரப்பும் பாண்டம் இது. இந்த உடல்மேல் கொண்ட காமமாகிய குழியில் விழாமல், மேலே ஏறும் வழியை அருள்வாய், இறைவா.",
      words: [["பாண்டம்","பானை; உடலுக்கு உவமை"],["தோகையர்","பெண்கள்"]],
      message: "உடல் நிலையற்றது; உடலின் மீதான மோகத்திலிருந்து மீள இறையருளை வேண்டுகிறார்.",
      english: "This foul-smelling body is fodder for jackals; grant that I climb out of the pit of desire rather than fall into it."
    },
    {
      book: "திருவேகம்பமாலை", title: "எல்லாம் அறிந்து படித்து",
      lines: ["எல்லாம் அறிந்து படித்தே யிருந்தெமக் குள்ளபடி","வல்லான் அறிந்துளன் என்றுணராது மதிமயங்கிச்","சொல்லான் மலைந்துறு சூழ்விதியின்படி துக்கித்துப்பின்","எல்லாம் சிவன்செயலே என்பார்காண் கச்சியேகம்பனே."],
      meaning: "எல்லாவற்றையும் கற்று அறிந்திருந்தும், எமக்கு உள்ளபடி நடப்பதை எல்லாம் வல்லவன் அறிவான் என்பதை உணராமல் மதி மயங்கி, சொற்களால் வாதிட்டு, சூழும் விதியால் துன்பப்பட்ட பின்புதான் ‘எல்லாம் சிவன் செயல்’ என்கிறார்கள்.",
      words: [["மதிமயங்கி","அறிவு கலங்கி"],["மலைந்து","மோதி, வாதிட்டு"],["விதி","ஊழ்"]],
      message: "துன்பம் வந்தபின் அல்ல, தொடக்கத்திலேயே இறைவனை நம்ப வேண்டும்.",
      english: "Learned people forget that the Almighty knows all, argue and suffer, and only afterwards say 'it is all Shiva's doing'."
    },
    {
      book: "திருவேகம்பமாலை", title: "கடுஞ்சொலின் வம்பரை",
      lines: ["கடுஞ்சொலின் வம்பரை ஈனரைக்குண்டரைக் காமுகரைக்","கொடும்பாவமே செய்யும் நிர்மூடர்தம்மைக் குவலயத்துள்","நெடும்பனைபோல வளர்ந்து நல்லோர் தம்நெறியறியா","இடும்பரை என்வகுத்தாய்; இறைவா, கச்சியேகம்பனே."],
      meaning: "கடுஞ்சொல் பேசும் வம்பர்கள், இழிந்தவர்கள், கீழோர், காமுகர், கொடிய பாவம் செய்யும் மூடர்கள் — இவர்களை நெடிய பனைபோல வளர்ந்தும் நல்லோர் நெறியை அறியாத இறுமாப்புடையவர்களாக, இறைவா, எதற்காகப் படைத்தாய்?",
      words: [["வம்பர்","வீண் வம்பு செய்பவர்"],["இடும்பர்","செருக்குடையவர்"],["குவலயம்","உலகம்"]],
      message: "உயர்ந்து வளர்ந்தாலும் நல்லொழுக்கம் இல்லாதவர் பனைபோல் பயனற்றவர் என்ற கருத்து.",
      english: "Why did you create the foul-mouthed, the wicked and the arrogant, who grow tall like palmyras yet know nothing of the good path?"
    },
    {
      book: "திருவேகம்பமாலை", title: "ஊரிருந்தென்ன",
      lines: ["ஊரிருந்தென்ன ? நல்லோர் இருந்தென்ன உபகாரமுள்ள","பேரிருந்தென்ன ? பெற்றதாய் இருந்தென் மடப்பெண்கொடியாள்","சீரிருந்தென்ன ? சிறப்பிருந் தென்ன இத்தேயத்தினில்","ஏரிருந்தென்ன ? வல்லாய் இறைவா கச்சியேகம்பனே."],
      meaning: "ஊர் இருந்து என்ன? நல்லவர்கள் இருந்து என்ன? உதவும் புகழ் இருந்து என்ன? பெற்ற தாய், இளம் மனைவி, சீர், சிறப்பு, இந்த நாட்டின் வளம் ஆகியவை இருந்தும் என்ன பயன்? எல்லாம் வல்ல இறைவா, இவை எதுவும் இறுதியில் துணையாகாது என்பதே பாடலின் குறிப்பு.",
      words: [["ஏர்","உழவு, நாட்டின் வளம்"],["மடப்பெண்","இளம் மனைவி"],["வல்லாய்","ஆற்றல் உடையவனே"]],
      message: "உலக வளங்களும் உறவுகளும் இறுதியில் காக்காது; இறைவனே துணை.",
      english: "What use are town, good people, fame, mother, wife, honour or fertile land? Only the Almighty stands by us in the end."
    },
    {
      book: "திருவேகம்பவிருத்தம்", title: "அன்னை எத்தனை எத்தனை",
      lines: ["அன்னை எத்தனை எத்தனை அன்னையோ?","அப்பன் எத்தனை எத்தனை அப்பனோ?","பின்னை எத்தனை எத்தனை பெண்டீரோ?","பிள்ளை எத்தனை எத்தனை பிள்ளையோ?","முன்னை எத்தனை எத்தனை சன்மமோ?","மூடனாயடி யேனும றிந்திலேன்,","இன்ன மெத்தனை யெத்தனை சன்மமோ?","என்செய் வேன்? கச்சியேகம்ப நாதனே?"],
      meaning: "எத்தனை அன்னையர், எத்தனை தந்தையர், எத்தனை மனைவியர், எத்தனை பிள்ளைகள்! முன்பு எத்தனை பிறவிகள் எடுத்தேனோ, மூடனாகிய நான் அறியவில்லை. இனியும் எத்தனை பிறவிகளோ! என்ன செய்வேன், கச்சி ஏகம்ப நாதனே?",
      words: [["சன்மம்","பிறவி"],["பெண்டீர்","மனைவியர்"],["நாதன்","தலைவன்"]],
      message: "பிறவிச் சுழற்சியின் நீளத்தை எண்ணி, அதிலிருந்து விடுதலை வேண்டும் பாடல்.",
      english: "How many mothers, fathers, wives and children, and how many births before and yet to come? What shall I do, Lord of Kanchi?"
    },
    {
      book: "திருவேகம்பமாலை", title: "ஊற்றைச் சரீரத்தை",
      lines: ["ஊற்றைச் சரீரத்தை யாபாசக் கொட்டிலை யூன்பொதிந்த","பீற்றற் றுருத்தியைச் சோறிடுந் தோற்பையைப் பேசரிய","காற்றிற் பொதிந்த நிலையற்ற பாண்டத்தைக் காதல் செய்தே","யேற்றித் திரிந்துவிட் டேனிறைவா, கச்சியேகம்பனே."],
      meaning: "அழுக்கு நிறைந்த உடல், அருவருப்பான கொட்டில், ஊனால் சுற்றப்பட்ட கசிவு பை, சோறு போடும் தோல்பை, காற்றால் நிறைந்த நிலையற்ற பானை — இவ்வுடலையே விரும்பிச் சுமந்து திரிந்துவிட்டேன், இறைவா.",
      words: [["ஊற்றை","அழுக்கு"],["ஆபாசம்","அருவருப்பு"],["தோற்பை","தோலால் ஆன பை"]],
      message: "உடல்மீதான பற்றின் வீணைத் தன்னையே நொந்து கூறும் பாடல்.",
      english: "A filthy, flesh-wrapped, leaking skin-bag filled with breath - I loved it and carried it about, Lord of Kanchi."
    },
    {
      book: "திருவிடைமருதூர்", title: "தாயும் பகை",
      lines: ["தாயும்பகை; கொண்ட பெண்டீர் பெரும்பகை; தன்னுடைய","சேயும்பகை; யுறவோரும் பகை; யிச்செகமும் பகை;","ஆயும் பொழுதி லருஞ்செல்வம் நீங்கில்! இக்காதலினாற்","தோயுநெஞ்சே, மருதீசர் பொற்பாதஞ் சுதந்திரமே."],
      meaning: "செல்வம் நீங்கிவிட்டால் தாயும் பகையாவாள்; மனைவி பெரும்பகை; பிள்ளையும் பகை; உறவினரும் பகை; இந்த உலகமே பகை. ஆகையால் உலகக் காதலில் தோய்ந்த நெஞ்சே, இடைமருதீசரின் பொன்னடியே உனக்கு நிலையான உரிமை.",
      words: [["செகம்","உலகம்"],["சேய்","பிள்ளை"],["சுதந்திரம்","உரிமையுடைய நிலையான புகலிடம்"]],
      message: "செல்வத்தைச் சார்ந்த உறவுகளின் நிலையற்ற தன்மையும், இறைவனடியே நிலையான புகலிடம் என்பதும்.",
      english: "When wealth is gone, even mother, wife, son and kin turn hostile; only the feet of the Lord of Idaimarudur are truly yours."
    },
    {
      book: "திருத்தில்லை", title: "காம்பிணங்கும் பணைத்தோளார்க்கும்",
      lines: ["காம்பிணங்கும் பணைத்தோளார்க்கும் பொன்னுக்குங் காசினிக்கும்","தாம்பிணங்கும் பலஆசையும் விட்டுத்தணித்துச் செத்துப்","போம்பிணம் தன்னைத் திரளாகக்கூடிப் புரண்டினிமேற்","சாம்பிணம் கத்துதையோ ? என்செய்வேன் தில்லைச்சங்கரனே."],
      meaning: "பெண்களுக்காகவும் பொன்னுக்காகவும் மண்ணுக்காகவும் மனிதர்கள் தமக்குள் மோதிக்கொள்ளும் பல ஆசைகளையும் விட்டு அடங்கி இறந்து போகும் பிணத்தைச் சுற்றித் திரண்டு புரண்டு அழுகிறார்கள். இனிச் சாகப்போகிற இவர்களே ‘சாம்பிணங்களாக’க் கத்துகிறார்களே! என்ன செய்வேன், தில்லைச் சங்கரனே?",
      words: [["காம்பு","மூங்கில்; தோளுக்கு உவமை"],["காசினி","நிலம், உலகம்"],["சாம்பிணம்","இனி இறக்கப்போகிறவர்"]],
      message: "ஆசைகளுக்காகப் போராடும் மனிதர் எல்லோரும் இறுதியில் சாகப்போகிறவர்களே என்ற நிலையாமைக் கருத்து.",
      english: "People quarrel over women, gold and land, then crowd round a corpse and wail - though they themselves are soon to die."
    },
    {
      book: "திருத்தில்லை", title: "சோறிடும் நாடு",
      lines: ["சோறிடும்நாடு, துணிதருங் குப்பை தொண்டன்பரைக்கண்டு","ஏறிடுங்கைகள் இறங்கிடுந் தீவினை, எப்பொழுதும்","நீறிடும் மேனியர் சிற்றம்பலவர் நிருத்தம்கண்டால்","ஊறிடுங் கண்கள் உருகிடும்நெஞ்சமென் னுள்ளமுமே."],
      meaning: "துறவிக்குச் சோறு தர நாடு உண்டு; உடுக்கத் துணி தர குப்பை மேடு உண்டு. அடியார்களைக் கண்டதும் கைகள் தொழுது உயரும்; தீவினைகள் இறங்கி அழியும். எப்போதும் திருநீறு பூசிய சிற்றம்பலவரின் நடனத்தைக் கண்டால் கண்கள் நீர் சுரக்கும்; நெஞ்சமும் உள்ளமும் உருகும்.",
      words: [["நீறு","திருநீறு"],["நிருத்தம்","நடனம்"],["தொண்டர்","அடியார்"]],
      message: "அடியார் வணக்கமும் ஆடல்வல்லானின் தரிசனமும் மனத்தை உருக்கித் தீவினையை நீக்கும்.",
      english: "Seeing devotees, hands rise in worship and sins fall away; seeing the dance of the ash-smeared Lord, eyes brim and the heart melts."
    },
    {
      book: "திருத்தில்லை", title: "அழலுக்குள் வெண்ணெய்",
      lines: ["அழலுக்குள்வெண்ணெய் எனவே உருகிப் பொன்னம்பலத்தார்","நிழலுக்குள் நின்றுதவம் உஞற்றாமல் நிட்டூரமின்னார்","குழலுக்கிசைந்த வகைமாலை கொண்டு குற்றேவல்செய்து","விழலுக்கு முத்துலை இட்டிறைத்தேனென் விதிவசமே."],
      meaning: "நெருப்பில் வெண்ணெய்போல் உருகி, பொன்னம்பலத்தாரின் நிழலில் நின்று தவம் செய்யாமல், கொடிய பெண்களின் கூந்தலுக்கேற்ற மாலைகள் கொண்டு ஏவல் செய்து, பயனற்ற புல்லுக்கு நீர் இறைத்தவன் ஆனேன். இது என் விதிப்பயன் போலும்.",
      words: [["அழல்","நெருப்பு"],["நிட்டூரம்","கொடுமை"],["விழல்","பயனற்ற புல்"]],
      message: "இறைவனுக்குச் செய்ய வேண்டிய தொண்டை உலகப் பற்றுக்குச் செய்த வீணைப் பற்றிய வருத்தம்.",
      english: "Instead of melting like butter in fire and doing penance in the Lord's shade, I served cruel women - pouring water on useless grass."
    },
    {
      book: "திருத்தில்லை", title: "ஓடாமற் பாழுக்குழையாமல்",
      lines: ["ஓடாமற் பாழுக்கு உழையாமல் ஓரமுரைப்பவர்பால்","கூடாமல் நல்லவர்கூட்டம் விடாமல் வெங்கோபம்நெஞ்சில்","நாடாமல் நன்மைவழுவாமல் இன்றைக்கு நாளைக்கென்று","தேடாமல் செல்வந் தருவாய், சிதம்பரதேசிகனே."],
      meaning: "அலைந்து ஓடாமல், வீணுக்கு உழைக்காமல், ஒருபக்கச் சார்பாகப் பேசுபவரோடு சேராமல், நல்லவர் கூட்டத்தை விடாமல், கடுங்கோபத்தை நெஞ்சில் நாடாமல், நன்மையிலிருந்து வழுவாமல், இன்றும் நாளையும் எனச் சேர்த்து வைக்காமல் வாழும் செல்வத்தை எனக்குத் தருவாய், சிதம்பர தேசிகனே.",
      words: [["ஓரம்","ஒருதலைச் சார்பு"],["வெங்கோபம்","கடும் சினம்"],["தேசிகன்","குரு, வழிகாட்டி"]],
      message: "பேராசை, சினம், வீண் அலைச்சல் இல்லாத அமைதியான வாழ்வே உண்மையான செல்வம்.",
      english: "Grant me the wealth of a life without needless running about, anger or hoarding for tomorrow, always in good company."
    },
    {
      book: "திருத்தில்லை", title: "பாராமல் ஏற்பவர்க்கு",
      lines: ["பாராம லேற்பவர்க் கில்லையென்னாமற் பழுதுசொல்லி","வாரமற் பாவங்கள் வந்தணுகாமல் மனமயர்ந்து","பேராமற் சேவைபுரியாம லன்புபெறா தவரைச்","சேராமற் செல்வந்தருவாய், சிதம்பர தேசிகனே."],
      meaning: "இந்தப் பாடலின் மின்னூல் வடிவத்தில் சில சொற்கள் தெளிவாக இல்லை; சொல்லுக்குச் சொல் பொருள் உறுதியாகக் கூற இயலவில்லை. பொதுக்கருத்து: இரப்பவர்க்கு ‘இல்லை’ என்று சொல்லாமலும், பிறரைப் பழிக்காமலும், பாவங்கள் அணுகாமலும், அன்பில்லாதவரைச் சேராமலும் வாழும் செல்வத்தை அருள்வாய் என்று வேண்டுகிறார்.",
      words: [["இல்லை என்னாமல்","இல்லை என்று மறுக்காமல்"],["சேவை","தொண்டு"]],
      message: "ஈகையும் நல்லொழுக்கமும் உடைய வாழ்வை வேண்டும் பாடல்.",
      english: "General sense: grant me the wealth of never refusing a beggar, never slandering, and keeping away from sin and the loveless."
    },
    {
      book: "திருத்தில்லை", title: "கொல்லாமற் கொன்றதைத் தின்னாமல்",
      lines: ["கொல்லாமற் கொன்றதைத் தின்னாமற் குத்திரங்கோள்கள்","கல்லாமற் கைதவரோ டிணங்காமற் கனவினும்பொய்","சொல்லாமற் சொற்களைக் கேளாமற் றோகையர்மாயையிலே","செல்லாமற் செல்வந் தருவாய், சிதம்பர தேசிகனே."],
      meaning: "உயிர்களைக் கொல்லாமல், கொன்றதைத் தின்னாமல், வஞ்சகத்தையும் புறங்கூறுதலையும் கற்காமல், வஞ்சகர்களோடு சேராமல், கனவிலும் பொய் சொல்லாமல், தீச்சொற்களைக் கேளாமல், பெண்களின் மாயையில் செல்லாமல் வாழும் செல்வத்தைத் தருவாய், சிதம்பர தேசிகனே.",
      words: [["குத்திரம்","வஞ்சகம்"],["கோள்","புறங்கூறல்"],["கைதவர்","வஞ்சகர்"]],
      message: "கொல்லாமை, வாய்மை, தீயோர் சேர்க்கை விடுதல் ஆகிய ஒழுக்கங்களைக் கூறும் வேண்டுதல்.",
      english: "Grant me a life of not killing or eating the killed, not learning deceit, never lying even in dreams, and not falling into illusion."
    },
    {
      book: "திருத்தில்லை", title: "முடிசார்ந்த மன்னரும்",
      lines: ["முடிசார்ந்த மன்னரு மற்றமுள்ளோரு முடிவிலொரு","பிடிசாம்ப ராய்வெந்து மண்ணாவதுங் கண்டுபின்னுமிந்தப்","பிடிசார்ந்த வாழ்வை நினைப்பதல் லாற்பொன்னினம்பலவ","ரடிசார்ந்து நாமுய்ய வேண்டுமென்றே யறிவாரில்லையே."],
      meaning: "முடி சூடிய மன்னர்களும் மற்றவர்களும் இறுதியில் ஒரு பிடி சாம்பலாக வெந்து மண்ணாவதைக் கண்டும், இந்தப் பற்றுள்ள வாழ்வையே நினைக்கிறார்களே தவிர, பொன்னம்பலவரின் திருவடியைச் சேர்ந்து நாம் உய்ய வேண்டும் என்று அறிபவர் இல்லையே!",
      words: [["சாம்பர்","சாம்பல்"],["உய்தல்","கடைத்தேறுதல்"]],
      message: "மன்னனும் மண்ணாவான்; அதைக் கண்டும் உணராத மனிதர்களின் மயக்கம்.",
      english: "Kings and commoners alike end as a handful of ash, yet people still cling to life and forget to seek the Lord's feet."
    },
    {
      book: "திருத்தில்லை", title: "காலையுபாதி மலஞ்சலம்",
      lines: ["காலையுபாதி மலஞ்சல மாமன்றிக் கட்டுச்சியிற்","சாலவுபாதி பசிதாக மாகுமுன் சஞ்சிதமாம்","மாலையுபாதி துயில்காம மாமிவை மாற்றிவிட்டே","ஆலமுகந்தரு ளம்பலவா, என்னை யாண்டருளே."],
      meaning: "காலையில் துன்பம் மலம், சிறுநீர் கழிப்பது; நண்பகலில் மிகுந்த துன்பம் பசியும் தாகமும்; மாலையில் துன்பம் உறக்கமும் காமமும். இவற்றை நீக்கி, நஞ்சை உகந்து ஏற்று அருளிய அம்பலவனே, என்னை ஆண்டருள்வாய்.",
      words: [["உபாதி","துன்பம், தொல்லை"],["கட்டுச்சி","நண்பகல்"],["ஆலம்","ஆலகால நஞ்சு"]],
      message: "உடலின் அன்றாடத் தொல்லைகளிலேயே பொழுது கழிவதை எண்ணி இறையருளை வேண்டுதல்.",
      english: "Morning's trouble is excretion, noon's hunger and thirst, evening's sleep and desire - free me from these and take me into your care."
    },
    {
      book: "திருத்தில்லை", title: "ஆயும் புகழ்த்தில்லை",
      lines: ["ஆயும்புகழ்ந்தில்லை யம்பலவாண ரருகிற் சென்றாற்","பாயுமிடபங், கடிக்குமரவம், பின்பற்றிச் சென்றாற்","பேயுங்கணமும் பெருந்தலைப் பூதமும் பின்தொடரும்","போயென்செய்வாய் மனமே ! பிணக்காடவர் போமிடமே."],
      meaning: "புகழ்ந்து போற்றப்படும் தில்லை அம்பலவாணரின் அருகில் சென்றால் காளை பாயும், பாம்பு கடிக்கும்; பின்தொடர்ந்து சென்றால் பேய்களும் கணங்களும் பெரிய தலைப் பூதங்களும் தொடரும். மனமே, அங்குப் போய் என்ன செய்வாய்? அது சுடுகாட்டில் உறைபவர் செல்லுமிடம்!",
      words: [["இடபம்","காளை; சிவனின் வாகனம்"],["அரவம்","பாம்பு"],["பிணக்காடவர்","சுடுகாட்டை இடமாகக் கொண்டவர்"]],
      message: "சிவனின் விசித்திரத் தோற்றத்தையும் துணைகளையும் நயமாகக் கூறி, மனத்தை வினவும் பாடல்.",
      english: "Near him the bull pounces and the snake bites; behind him ghosts and goblins follow - what will you do there, my mind?"
    },
    {
      book: "திருத்தில்லை", title: "ஓடுமெடுத்து",
      lines: ["ஓடுமெடுத்தத ளாடையுஞ் சுற்றி, யுலாவிமெள்ள","வீடுகடோறும் பலிவாங்கியே, விதி யற்றவர்போ","லாடுமருட் கொண்டிங்கு அம்பலத்தேநிற்கு மாண்டிதன்னைத்","தேடுங் கணக்கென்னகாண் ? சிவகாம சவுந்தரியே."],
      meaning: "ஓட்டை (கபாலத்தை) ஏந்தி, கந்தலாடை சுற்றி, மெல்ல உலவி, வீடுதோறும் பிச்சை வாங்கி, விதியற்றவர் போல ஆடி, அருளோடு அம்பலத்தில் நிற்கும் இந்த ஆண்டியை நான் தேடிக் காணும் வழி என்ன, சிவகாம சுந்தரியே?",
      words: [["பலி","பிச்சை"],["ஆண்டி","பிச்சையேற்கும் துறவி; இங்கே சிவன்"],["சிவகாமசுந்தரி","தில்லையில் உறையும் அம்மை"]],
      message: "பிச்சை ஏற்கும் ஆண்டியாகத் தோன்றும் இறைவனை அம்மையிடம் வினவும் அழகிய பாடல்.",
      english: "A skull-bowl in hand, in rags, begging door to door, yet standing in grace in the hall - how do I find this beggar-lord, O Sivakami?"
    },
    {
      book: "திருத்தில்லை", title: "ஊட்டுவிப்பானும்",
      lines: ["ஊட்டுவிப்பானு முறங்குவிப்பானுமிங் கொன்றோ டொன்றை","மூட்டுவிப்பானு முயங்குவிப்பானு முயன்ற வினை","காட்டுவிப்பானு மிருவினைப் பாசக் கயிற்றின்வழி","யாட்டுவிப்பானு மொருவனுண் டேதில்லை யம்பலத்தே."],
      meaning: "உண்ணச் செய்பவனும், உறங்கச் செய்பவனும், ஒன்றோடு ஒன்றைச் சேர்ப்பவனும், கூடச் செய்பவனும், செய்த வினையின் பயனைக் காட்டுபவனும், இருவினைப் பாசக் கயிற்றின் வழி நம்மை ஆட்டுவிப்பவனுமான ஒருவன் தில்லை அம்பலத்தில் உண்டு.",
      words: [["இருவினை","நல்வினை, தீவினை"],["பாசம்","கட்டு"],["ஆட்டுவிப்பான்","ஆட்டுபவன்; பொம்மலாட்டம் செய்பவன் போல"]],
      message: "நம் செயல்கள் அனைத்தையும் இயக்குபவன் தில்லை அம்பலவனே.",
      english: "One in the Thillai hall makes us eat, sleep, unite, reaps our karma, and makes us dance on the rope of two-fold deeds."
    },
    {
      book: "திருத்தில்லை", title: "அடியார்க் கெளியவர்",
      lines: ["அடியார்க் கெளியவ ரம்பலவாண ரடிபணிந்தால்","மடியாமற்செல்வ வரம்பெறலாம், வையம் ஏழளந்த","நெடியோனும் வேதனுங்காணாத நித்த நிமலனருட்","குடிகாணு நாங்களவர்காணு மெங்கள் குலதெய்வமே."],
      meaning: "அம்பலவாணர் அடியார்களுக்கு எளியவர். அவர் திருவடியைப் பணிந்தால் அழியாத செல்வமாகிய வரத்தைப் பெறலாம். ஏழு உலகங்களை அளந்த திருமாலும் பிரமனும் காணாத நிலையான தூய இறைவனின் அருளுக்குக் குடிகள் நாம்; அவரே எங்கள் குலதெய்வம்.",
      words: [["மடியாமல்","அழியாமல், சோர்வின்றி"],["நெடியோன்","திருமால்"],["நிமலன்","தூயவன்"]],
      message: "திருமால், பிரமனுக்கும் எட்டாத இறைவன், அடியார்க்கு எளியவன்.",
      english: "Easy for devotees to reach, though unseen by Vishnu and Brahma - bow at his feet for imperishable wealth; he is our family deity."
    },
    {
      book: "திருத்தில்லை", title: "தெய்வச் சிதம்பரதேவா",
      lines: ["தெய்வச் சிதம்பரதேவா, உன்சித்தந் திரும்பிவிட்டாற்","பொய்வைத்த சொப்பனமா மன்னர்வாழ்வும் புவியுமெங்கே?","மெய்வைத்த செல்வமெங்கே? மண்டலீகர்தம் மேடையெங்கே?","கைவைத்த நாடகசாலையெங்கே? இது கண்மயக்கே."],
      meaning: "தெய்வமாகிய சிதம்பர தேவனே, உன் திருவுள்ளம் மாறினால் கனவுபோன்ற மன்னர்களின் வாழ்வும் உலகமும் எங்கே? நிலையான செல்வம் எங்கே? அரசர்களின் மேடைகள் எங்கே? கைதேர்ந்த நாடக அரங்குகள் எங்கே? இவை எல்லாம் கண்ணின் மயக்கமே.",
      words: [["சித்தம்","திருவுள்ளம்"],["மண்டலீகர்","சிற்றரசர்"],["நாடகசாலை","நாடக அரங்கம்"]],
      message: "உலகச் செல்வமும் ஆட்சியும் கண்மயக்கம் போன்றவை.",
      english: "If your will turns, where are dream-like kings' lives, wealth, thrones and theatres? All this is an illusion of the eye."
    },
    {
      book: "திருத்தில்லை", title: "உடுப்பானும் பாலன்னமுண்பானும்",
      lines: ["உடுப்பானும் பாலன்னமுண்பானு முய்வித்தொருவர் தம்மைக்","கெடுப்பானு மேதென்று கேள்விசெய்வானுங் கெதியடங்கக்","கொடுப்பானுந் தேகியென்றேற்பானும் ஏற்கக் கொடாமனின்று","தடுப்பானு நீயல்லையோ? தில்லையானந்தத் தாண்டவனே."],
      meaning: "உடுப்பவனும், பாலன்னம் உண்பவனும், ஒருவரைக் காப்பவனும், கெடுப்பவனும், ‘இது என்ன’ என்று கேள்வி கேட்பவனும், எல்லாம் அடங்க ஈபவனும், தேகி என்று ஏற்பவனும், ஏற்க விடாமல் தடுப்பவனும் ஆகிய எல்லாம் நீயே அல்லவா, தில்லையில் ஆனந்தத் தாண்டவம் ஆடுபவனே? (இது பாடலின் பொதுக்கருத்து.)",
      words: [["உய்வித்தல்","காத்தல்"],["தேகி","இரப்பவன்"],["தாண்டவன்","கூத்தாடுபவன்"]],
      message: "கொடுப்பவனும் பெறுபவனும் தடுப்பவனும் என்ற எல்லா வேடங்களிலும் இருப்பவன் இறைவனே.",
      english: "The one who clothes, eats, saves, ruins, gives, begs and forbids - are they not all you, dancer of bliss at Thillai?"
    },
    {
      book: "திருத்தில்லை", title: "வித்தாரம் பேசினும்",
      lines: ["வித்தாரம் பேசினுஞ் சோங்கேறினுங் கம்பமீதிருந்து","தத்தாரவென் றோதிப் பவுரிகொண்டாடினுந் தம்முன்தம்பி","யத்தாசைபேசினு மாவதுண்டோ? தில்லையுண்ணிறைந்த","கத்தாவின் சொற்படியல்லாது வேறில்லை கன்மங்களே."],
      meaning: "எவ்வளவு விரிவாகப் பேசினாலும், உயரம் ஏறினாலும், கம்பத்தின்மேல் ஏறி ஆடிக் கொண்டாடினாலும், அண்ணன் தம்பி அன்பைப் பேசினாலும் ஆவது என்ன? தில்லையில் நிறைந்த இறைவனின் ஆணைப்படியன்றி வேறு செயல்கள் நடப்பதில்லை. (இரண்டாம் அடியின் சில சொற்கள் தெளிவற்றவை; இது பொதுக்கருத்து.)",
      words: [["வித்தாரம்","விரிவு"],["கத்தா","கர்த்தா, செய்பவன்"],["கன்மம்","செயல், வினை"]],
      message: "நம் முயற்சிகளையும் செயல்களையும் இயக்குவது இறைவனின் ஆணையே.",
      english: "However much we talk, climb or dance about, no deed happens except by the will of the Creator who fills Thillai."
    },
    {
      book: "திருத்தில்லை", title: "பிறவாதிருக்க வரம்பெறல்",
      lines: ["பிறவாதிருக்க வரம்பெறல் வேண்டும், பிறந்துவிட்டா","லிறவாதிருக்க மருந்துண்டு காணிது வெப்படியோ","அறமார் புகழ்த்தில்லை யம்பலவாண ரடிக்கமல","மறவா திருமனமே, யதுகாணநல் மருந்துனக்கே."],
      meaning: "பிறக்காமல் இருக்க வரம் பெற வேண்டும்; பிறந்துவிட்டால் இறவாமல் இருக்க மருந்து உண்டு. அது எப்படியோ என்றால், அறம் நிறைந்த புகழுடைய தில்லை அம்பலவாணரின் திருவடித் தாமரையை மனமே, மறவாமல் இரு; அதுவே உனக்கு நல்ல மருந்து.",
      words: [["அடிக்கமலம்","திருவடித் தாமரை"],["மருந்து","இங்கே பிறவிப் பிணிக்கான மருந்து"]],
      message: "பிறவிப் பிணிக்கு இறைவனின் திருவடி நினைவே மருந்து.",
      english: "Pray not to be born; if born, there is a medicine against dying - never forget the lotus feet of the Lord of Thillai."
    },
    {
      book: "திருத்தில்லை", title: "தவியாதிரு நெஞ்சமே",
      lines: ["தவியாதிரு நெஞ்சமே, தில்லைமேவிய சங்கரனைப்","புவியார்ந் திருக்கின்ற ஞானாகரனைப் புராந்தகனை","அவியாவிளக்கைப் பொன்னம்பலத் தாடியை ஐந்தெழுத்தால்","செவியாமல் நீசெபித்தாற் பிறவாமுத்தி சித்திக்குமே."],
      meaning: "நெஞ்சமே, வருந்தாதே. தில்லையில் விளங்கும் சங்கரனை, உலகெலாம் நிறைந்த ஞானச் சுரங்கத்தை, முப்புரம் எரித்தவனை, அணையாத விளக்கை, பொன்னம்பலத்தில் ஆடுபவனை ஐந்தெழுத்தால் சோர்வின்றிச் செபித்தால் பிறவாத முத்தி கிட்டும்.",
      words: [["ஞானாகரன்","ஞானத்தின் இருப்பிடம்"],["புராந்தகன்","முப்புரம் எரித்தவன்"],["அவியா விளக்கு","அணையாத ஒளி"]],
      message: "ஐந்தெழுத்து செபமே பிறவா முத்திக்கு வழி.",
      english: "Do not fret, heart; chant Shiva's five letters tirelessly and you will gain liberation from rebirth."
    },
    {
      book: "திருத்தில்லை", title: "நாலின் மறைப்பொருள்",
      lines: ["நாலின் மறைப்பொரு ளம்பலவாணரை நம்பியவர்","பாலிலொருதரஞ் சேவிக்கொணா திருப்பார்க் கருங்கல்","மேலிலெடுத்தவர் கைவிலங்கைத் தைப்பர், மீண்டுமொரு","காலினிறுத்துவர், கிட்டியுந் தாம்வந்து கட்டுவரே."],
      meaning: "இந்தப் பாடலின் மின்னூல் வடிவம் பல இடங்களில் தெளிவற்றதாக உள்ளது; அதனால் சொல்லுக்குச் சொல் பொருள் உறுதியாகக் கூற இயலவில்லை. நான்மறைப் பொருளாகிய அம்பலவாணரை நம்பி வழிபடாதவர்கள் துன்பப்பட்டுக் கட்டுண்பர் என்ற தொனி உள்ளது. உறுதியான பொருளுக்கு அச்சு உரை நூலைப் பார்க்கவும்.",
      words: [["நாலின் மறை","நான்கு வேதம்"],["கைவிலங்கு","கையில் இடும் விலங்கு"]],
      message: "இறைவனை நம்பி வணங்குவதன் இன்றியமையாமை (பொதுக்கருத்து).",
      english: "Text unclear in the e-text; broadly, those who do not trust and worship the Lord of the four Vedas end up bound. Please check a printed commentary."
    },
    {
      book: "திருத்தில்லை", title: "ஆற்றோடு தும்பை",
      lines: ["ஆற்றோடு தும்பை யணிந்தாடும் அம்பலவாணர்தம்மைப்","போற்றாதவர்க்கு அடையாளமுண் டேயிந்தப் பூதலத்திற்","சோற்றாவி யற்றுச்சுகமற்றுச் சுற்றத் துணியுமற்றே","ஏற்றாலும் பிச்சைகிடையாம லேக்கற் றிருப்பார்களே."],
      meaning: "கங்கையோடு தும்பைப் பூவையும் அணிந்து ஆடும் அம்பலவாணரைப் போற்றாதவர்க்கு இந்த உலகில் ஓர் அடையாளம் உண்டு: உணவு இல்லாமல், சுகம் இல்லாமல், சுற்றமும் உடையும் இல்லாமல், பிச்சை ஏற்றாலும் கிடைக்காமல் ஏங்கி இருப்பார்கள்.",
      words: [["ஆறு","கங்கை"],["தும்பை","தும்பைப் பூ"],["ஏக்கற்றிருத்தல்","ஏங்கித் தவித்தல்"]],
      message: "இறைவனைப் போற்றாதவரின் வறுமை நிலையை எச்சரிக்கையாகக் கூறும் பாடல்.",
      english: "Those who do not praise the Lord who wears the Ganga and tumbai flowers are marked: no food, comfort, kin or clothes, and no alms even when they beg."
    },
    {
      book: "திருத்தில்லை", title: "அத்தனை முப்பத்து முக்கோடி",
      lines: ["அத்தனை, முப்பத்து முக்கோடி தேவர்க் கதிபதியை","நித்தனை, அம்மை சிவகாமசுந்தரி நேசனை, யெம்","கூத்தனைப் பொன்னம் பலத்தாடு மையனைக் காணக்கண்கள்","எத்தனை கோடி யுகமோ தவஞ்செய் திருக்கின்றவே."],
      meaning: "தந்தையானவனை, முப்பத்து முக்கோடி தேவர்களுக்கும் தலைவனை, என்றும் உள்ளவனை, சிவகாமசுந்தரி அம்மையின் அன்பனை, எங்கள் கூத்தனை, பொன்னம்பலத்தில் ஆடும் ஐயனைக் காணும் இந்தக் கண்கள் எத்தனை கோடி யுகங்கள் தவம் செய்தனவோ!",
      words: [["அத்தன்","தந்தை"],["நித்தன்","அழிவற்றவன்"],["யுகம்","நீண்ட காலப்பகுதி"]],
      message: "இறைவனைக் காணும் பேறு கோடி யுகத் தவத்தின் பயன்.",
      english: "How many crores of ages of penance must these eyes have done to behold the dancing Lord of the golden hall!"
    },
    {
      book: "திருவேகம்பமாலை", title: "கைப்பிடி நாயகன் தூங்கையிலே",
      lines: ["கைப்பிடி நாயகன் தூங்கையிலே யவன்கையெடுத்து","அப்புறந்தன்னி லசையாமல் முன்வைத் தயல்வளவில்","ஒப்புடன்சென்று துயில்நீத்துப் பின்வந் துறங்குவளை","எப்படிநான் நம்புவேன்? இறைவா ! கச்சியேகம்பனே !"],
      meaning: "மணந்த கணவன் உறங்கும்போது அவன் கையை அசையாமல் எடுத்து அப்பால் வைத்து, அடுத்த வளவுக்குச் சென்று, மீண்டு வந்து உறங்குபவளை எப்படி நம்புவேன்? உலக உறவுகளின் நம்பகமின்மையைத் துறவு நோக்கில் சுட்டும் பாடல்.",
      words: [["கைப்பிடி நாயகன்","மணந்த கணவன்"],["வளவு","வீட்டுப் புறம், அடுத்த வீடு"]],
      message: "உலக உறவுகள் மீது முழு நம்பிக்கை வைக்கலாகாது; இறைவனே நம்பத்தக்கவன்.",
      english: "How can I trust worldly bonds? - a bleak, renunciant view of unreliable attachments."
    },
    {
      book: "திருவேகம்பமாலை", title: "நன்னாரில் பூட்டிய சூத்திரப்பாவை",
      lines: ["நன்னாரில் பூட்டிய சூத்திரப்பாவை நன்னார்தப்பினால்","நன்னாலுமாடிச் சலித்திடுமோ அந்தத் தன்மையைப்போல்","உன்னால்யானுந் திரிவதல்லால் மற்றுனைப் பிரிந்தால்","என்னாலிங் காவதுண்டோ? இறைவா ! கச்சியேகம்பனே !"],
      meaning: "நூலால் கட்டி ஆட்டுவிக்கப்படும் பொம்மை, நூல் தவறினால் ஆடுமா? அதுபோல நானும் உன்னால்தான் இயங்குகிறேன்; உன்னைப் பிரிந்தால் என்னால் இங்கு ஆவது என்ன?",
      words: [["சூத்திரப்பாவை","நூலால் இயக்கப்படும் பொம்மை"],["நார்","நூல், கயிறு"]],
      message: "நம் இயக்கம் அனைத்தும் இறைவனின் இயக்கமே.",
      english: "A string-puppet cannot move if the strings fail; I move only by you and can do nothing apart from you."
    },
    {
      book: "திருவேகம்பமாலை", title: "அன்னவிசாரம் அதுவே விசாரம்",
      lines: ["அன்னவிசார மதுவேவிசாரம் அதுவொழிந்தால்","சொன்ன விசாரந் தொலையா விசாரம் நல்தோகையரைப்","பன்னவிசாரம் பலகால் விசாரமிப் பாவிநெஞ்சுக்கு","என்னவிசாரம் வைத்தாய் இறைவா, கச்சியேகம்பனே !"],
      meaning: "உணவைப் பற்றிய கவலை; அது ஒழிந்தால் வேறு கவலைகள் தொலையாமல் தொடர்கின்றன; பெண்களைப் பற்றிய கவலையும் பலமுறை வருகிறது. பாவியான இந்த நெஞ்சுக்கு எத்தனை கவலைகளை வைத்தாய், இறைவா!",
      words: [["விசாரம்","கவலை, சிந்தனை"],["தோகையர்","பெண்கள்"]],
      message: "கவலைகள் முடிவதில்லை; அவற்றை விட்டு இறைவனை நினைக்க வேண்டும்.",
      english: "Worry about food, then endless other worries, worry about women - what worries you have laid on this heart!"
    },
    {
      book: "திருவேகம்பமாலை", title: "மாயநட்போரையும்",
      lines: ["மாயநட் போரையும் மாயா மலமெனும் மாதரையும்","வீயவிட்டோடி வெளியே புறப்பட்டு மெய்யருளாம்","தாயுடன் சென்றுபின் தாதையைக் கூடிப்பின் தாயைமறந்","தேயும தேநிட்டை, யென்றா னெழிற் கச்சியேகம்பனே."],
      meaning: "போலி நண்பர்களையும் மாயையான மலமாகிய மாதரையும் விட்டு ஓடி வெளியேறி, மெய்யருளாகிய தாயுடன் சென்று, பின் தந்தையாகிய சிவனைச் சேர்ந்து, பிறகு தாயையும் மறந்து அதிலேயே நிலைத்தலே நிட்டை என்று அழகிய கச்சி ஏகம்பன் உரைத்தான்.",
      words: [["நட்போர்","நண்பர்"],["தாதை","தந்தை"],["நிட்டை","ஆழ்ந்த தவ நிலை"]],
      message: "அருளின் வழியாக இறைவனை அடைந்து, அந்நிலையிலேயே நிலைத்தல் மெய்ந்நெறி.",
      english: "Leave false friends and illusory attachments, go with Grace as mother to the Father, and abide there - that is true meditation."
    },
    {
      book: "திருவேகம்பமாலை", title: "வரிக்கோல வேல்விழியார்",
      lines: ["வரிக்கோல வேல்விழியார் அநுராக மயக்கிற்சென்று","சரிக்கோதுவேன் எழுத்தஞ்சுஞ் சொலேன், தமியேனுடலம்","நரிக்கோ? கழுகுபருந்தினுக்கோ? வெய்யநாய் தனக்கோ?","எரிக்கோ? இரையெதற்கோ? இறைவா, கச்சியேகம்பனே."],
      meaning: "அழகிய வேல்விழிப் பெண்களின் காதல் மயக்கில் சென்று வீண்பேச்சு பேசுகிறேன்; ஐந்தெழுத்தை ஓதுவதில்லை. தனியனான என் உடல் நரிக்கோ, கழுகு பருந்துக்கோ, கொடிய நாய்க்கோ, நெருப்புக்கோ? யாருக்கு இரையாகப் போகிறது, இறைவா? (முதல் அடியின் ஒரு சொல் தெளிவற்றது.)",
      words: [["அநுராகம்","காதல், பற்று"],["எழுத்தஞ்சு","நமசிவாய"]],
      message: "உடல் இறுதியில் இரையாகும்; ஐந்தெழுத்தை ஓதாத வாழ்வின் வீண்.",
      english: "Lost in the charms of women, I never chant your five letters; my body will be food for jackals, vultures, dogs or fire."
    },
    {
      book: "திருவேகம்பமாலை", title: "காதென்று மூக்கென்று",
      lines: ["காதென்று மூக்கென்று கண்ணென்று காட்டியென் கண்ணெதிரே","மாதென்று சொல்லி வருமாயை தன்னை மறலிவிட்ட","தூதென் றெண்ணாமற் ககமென்று நாடுமித் துர்ப்புத்தியை","ஏதென் றெடுத்துரைப்பேன்? இறைவா, கச்சியேகம்பனே."],
      meaning: "காது, மூக்கு, கண் என்று காட்டி, ‘பெண்’ என்று என் கண்முன் வரும் மாயையை, எமன் அனுப்பிய தூது என்று எண்ணாமல் இல்லம் என்று நாடும் இந்தக் கெட்ட புத்தியை என்னவென்று சொல்வேன், இறைவா?",
      words: [["மறலி","எமன்"],["ககம்","அகம், வீடு"],["துர்ப்புத்தி","தீய அறிவு"]],
      message: "புற அழகு ஒரு மாயை என்று அறியாத மயக்கம்.",
      english: "Showing ears, nose and eyes, illusion comes as a woman; I fail to see it as Death's messenger and seek it as a home - what can I say of such folly?"
    },
    {
      book: "திருவேகம்பமாலை", title: "சீறும்வினையது பெண்ணுருவாகி",
      lines: ["சீறும்வினையது பெண்ணுரு வாகித் திரண்டுருண்டு","கூறுமுலையு மிறைச்சியு மாகிக் கொடுமையினால்","பீறுமலமு முதிரமுஞ் சாயும் பெருங்குழிவிட்டு","ஏறுங்கரைகண்டி லேன், இறைவா, கச்சியேகம்பனே."],
      meaning: "சீறும் வினையே பெண்ணுருவாகி வந்து, ஊன் திரண்டு, கொடுமையால் மலமும் உதிரமும் சாயும் பெரிய குழியில் என்னை வீழ்த்தியது; அதிலிருந்து ஏறும் கரையை நான் காணவில்லை, இறைவா.",
      words: [["வினை","முன்செய்த செயலின் பயன்"],["உதிரம்","இரத்தம்"]],
      message: "காமத்தின் குழியிலிருந்து மீள இறையருள் வேண்டும் புலம்பல்.",
      english: "Fierce karma took a woman's form and threw me into a pit of filth; I see no shore to climb out, Lord."
    },
    {
      book: "திருவேகம்பமாலை", title: "பொருளுடையோரைச் செயலினும்",
      lines: ["பொருளுடை யோரைச் செயலினும் வீரரைப் போர்க்களத்தும்","தெருளுடை யோரை முகத்தினுந் தேர்ந்து தெளிவதுபோல்","அருளுடை யோரைத் தவத்திற் குணத்தி லருளிலன்பில்","இருளுறு சொல்லினுந் காணத்தகுங் கச்சி யேகம்பனே."],
      meaning: "செல்வர்களை அவர்கள் செயலால், வீரரைப் போர்க்களத்தில், தெளிவுடையோரை அவர் முகத்தால் அறிவது போல, அருளுடையோரைத் தவம், குணம், அருள், அன்பு, சொல் ஆகியவற்றால் அறியலாம், கச்சி ஏகம்பனே. (கடைசி அடி மின்னூலில் சற்றுத் தெளிவற்றது.)",
      words: [["தெருள்","தெளிவு"],["அருளுடையோர்","கருணை உடையவர்"]],
      message: "ஒருவரின் தகுதி அவர் செயலிலும் குணத்திலும் தெரியும்.",
      english: "As the rich are known by deeds, heroes on the battlefield and the clear-minded by their faces, the gracious are known by penance, conduct and love."
    },
    {
      book: "திருவேகம்பமாலை", title: "பருத்திப் பொதியினைப்போலே",
      lines: ["பருத்திப் பொதியினைப்போலே வயிறுபருக்கத் தங்கள்","துருத்திக்கு அறுசுவை போடுகின்றார், துறந்தோர்தமக்கு","வருத்தி யமுதிடமாட்டார், அவரையிம் மாநிலத்தில்","இருத்திக் கொண்டேனிருந்தா யிறைவா! கச்சியேகம்பனே."],
      meaning: "பருத்திப் பொதிபோல் வயிறு பருக்க, துருத்திபோன்ற தங்கள் வயிற்றுக்கு அறுசுவை உணவு போடுகிறார்கள்; ஆனால் துறவிகளுக்கு மனமுவந்து உணவிட மாட்டார்கள். அத்தகையோரை இந்த உலகில் வைத்திருக்கிறாயே, இறைவா!",
      words: [["துருத்தி","தோல்பை; வயிற்றுக்கு உவமை"],["அறுசுவை","ஆறு வகைச் சுவை"]],
      message: "தனக்கே வயிறு வளர்த்து, துறவிக்கு ஈயாத தன்மையைக் கடிகிறார்.",
      english: "They stuff their bellies with six-flavoured feasts yet will not feed a renunciant - and you let such people live, Lord."
    },
    {
      book: "திருவேகம்பமாலை", title: "பொல்லா விருளகற்றுங் கதிர்",
      lines: ["பொல்லா விருளகற் றுங்கதிர் கூகையென் புட்கண்ணினுக்கு","அல்லா யிருந்திடு மாறொக்குமே அறிவோ ருளத்தில்","வல்லா ரறியார் தமக்கு மயக்கங் கண்டாய்,","எல்லாம் விழிமயக் கேயிறைவா, கச்சி யேகம்பனே."],
      meaning: "இருளை அகற்றும் கதிரவன் ஒளி ஆந்தையின் கண்ணுக்கு இருளாகவே இருப்பதுபோல், அறிவுடையோர் உள்ளத்தில் தெளிவாக விளங்குவது அறியாதவர்க்கு மயக்கமாகவே இருக்கிறது. எல்லாம் பார்வையின் மயக்கமே, இறைவா.",
      words: [["கூகை","ஆந்தை"],["புள்","பறவை"]],
      message: "இறைவனின் ஒளி அறிவுக்கண் உள்ளவருக்கே விளங்கும்.",
      english: "Sunlight is darkness to an owl's eye; likewise what is clear to the wise is delusion to the ignorant."
    },
    {
      book: "திருவேகம்பமாலை", title: "வாதுக்குச் சண்டைக்குப் போவார்",
      lines: ["வாதுக்குச் சண்டைக்குப் போவார், வருவார் வழக்குரைப்பர்;","தீதுக் குதவியுஞ் செய்திடுவார், தினந்தேடி ஒன்று","மாதுக் களித்து மயங்கிடுவார் விதி மாளுமட்டும்","ஏதுக்கிவர் பிறந்தார்? இறைவா, கச்சியேகம்பனே."],
      meaning: "வாதத்துக்கும் சண்டைக்கும் போவார்கள்; வழக்குப் பேசுவார்கள்; தீமைக்கும் உதவுவார்கள்; தினமும் தேடியதைப் பெண்ணுக்குக் கொடுத்து மயங்கி, விதி முடியும் வரை வாழ்கிறார்கள். இவர்கள் எதற்காகப் பிறந்தார்கள், இறைவா?",
      words: [["வாது","விவாதம்"],["மாளுதல்","முடிதல்"]],
      message: "வீண் சண்டையிலும் மயக்கத்திலும் கழியும் வாழ்வின் பயனின்மை.",
      english: "They go to quarrels and lawsuits, aid wrongdoing, squander earnings on infatuation until fate ends - why were they born?"
    },
    {
      book: "திருவேகம்பமாலை", title: "ஓயாமற் பொய்சொல்வர்",
      lines: ["ஓயாமற் பொய்சொல்வர், நல்லோரை நிந்திப்பர், உற்றுப்பெற்ற","தாயாரை வைவர், சதியாயிரஞ் செய்வார், சாத்திரங்கள்","ஆயார், பிறர்க்குபகாரஞ் செய்யார், தமையண்டி னர்க்கொன்","றீயா ரிருந்தென்ன போயென்னகாண் கச்சி யேகம்பனே."],
      meaning: "இடைவிடாமல் பொய் சொல்வார்கள்; நல்லவர்களைப் பழிப்பார்கள்; பெற்ற தாயைத் திட்டுவார்கள்; ஆயிரம் சூழ்ச்சி செய்வார்கள்; நூல்களை ஆராய மாட்டார்கள்; பிறர்க்கு உதவ மாட்டார்கள்; தம்மை அடைந்தவர்க்கு ஒன்றும் தர மாட்டார்கள். இவர்கள் இருந்தென்ன, போயென்ன?",
      words: [["நிந்தித்தல்","பழித்தல்"],["சதி","சூழ்ச்சி"],["உபகாரம்","உதவி"]],
      message: "பொய், பழிப்பு, ஈயாமை ஆகிய குற்றங்களைச் சுட்டும் பாடல்.",
      english: "They lie ceaselessly, slander the good, curse their mother, scheme and never help or give - what difference does their life make?"
    },
    {
      book: "திருவேகம்பமாலை", title: "அப்பென்றும் வெண்மையதாயினும்",
      lines: ["அப்பென்றும் வெண்மையதாயினும் ஆங்கந்நிலத்தியல் பாய்த்","தப்பின்றியே குணவேற்றுமை தான்பல சார்தலினால்","செப்பில் அபக்குவம் பக்குவமாயுள்ள சீவரிலும்","இப்படி யே நிற்பன் எந்தைபிரான் கச்சியேகம்பனே."],
      meaning: "நீர் எப்போதும் நிறமற்றதாயினும், அது சேரும் நிலத்தின் இயல்புக்கேற்பப் பல குணங்களைப் பெறுவதுபோல், பக்குவம் அடையாத உயிர்களிலும் பக்குவம் அடைந்த உயிர்களிலும் எம் தந்தையாகிய கச்சி ஏகம்பன் அவ்வவற்றின் தகுதிக்கேற்ப நிற்பான். (பொதுக்கருத்து)",
      words: [["அப்பு","நீர்"],["பக்குவம்","முதிர்ச்சி"],["சீவர்","உயிர்கள்"]],
      message: "ஆன்மாவின் பக்குவத்துக்கேற்பவே இறைவனின் வெளிப்பாடு.",
      english: "As colourless water takes on the nature of the soil it meets, the Lord appears according to the maturity of each soul."
    },
    {
      book: "திருவேகம்பமாலை", title: "நாயாய்ப் பிறந்திடில்",
      lines: ["நாயாய்ப் பிறந்திடில் நல்வேட்டை யாடிநயம் புரியும்","தாயார் வயிற்றில் நரராய்ப் பிறந்துபின் சம்பன்னராய்க்","காயா மரமும் வறளாங் குளமுங் கல்லாவு மன்ன","ஈயா மனிதரை யேன் படைத்தாய்? கச்சி யேகம்பனே."],
      meaning: "நாயாகப் பிறந்தால் நன்றாக வேட்டையாடிச் சொந்தக்காரனுக்கு உதவும். தாயின் வயிற்றில் மனிதராகப் பிறந்து செல்வராகியும், காய்க்காத மரம், வறண்ட குளம், கல்லால் ஆன பசு போல ஈயாதவர்களை ஏன் படைத்தாய், கச்சி ஏகம்பனே?",
      words: [["சம்பன்னர்","செல்வம் உடையவர்"],["ஈயாதவர்","கொடுக்காதவர்"]],
      message: "செல்வம் இருந்தும் ஈயாதவர் பயனற்றவர்.",
      english: "A dog at least hunts for its master; why create rich humans who give nothing, like fruitless trees, dry ponds and stone cows?"
    },
    {
      book: "திருவேகம்பமாலை", title: "ஆற்றிற் கரைத்த புளி",
      lines: ["ஆற்றில் கரைத்த புளியாக்கிடாமலென் னன்பை யெல்லாம்","போற்றித் திருவுளம் பற்றுமை யாபுர மூன்றெரித்துக்","கூற்றைப் பணிகொளுந் தாளுடையாய், குன்றவில்லுடையாய்","ஏற்றுக் கொடியுடையாய், இறைவா ! கச்சியேகம்பனே."],
      meaning: "ஆற்றில் கரைத்த புளிபோல என் அன்பை வீணாக்காமல் ஏற்றுக் கொள்வாய். முப்புரம் எரித்தவனே, எமனைத் திருவடியால் அடக்கியவனே, மலை வில் ஏந்தியவனே, காளைக் கொடி உடையவனே, இறைவா! (மூன்றாம் வரியில் ஒரு சொல் மின்னூலில் தெளிவற்றது.)",
      words: [["புரமூன்று","முப்புரங்கள்"],["கூற்று","எமன்"],["குன்றவில்","மேரு மலை வில்"]],
      message: "தன் அன்பு வீண்போகாமல் இறைவன் ஏற்க வேண்டும் என்னும் வேண்டுதல்.",
      english: "Do not let my love be wasted like tamarind dissolved in a river; accept it, O destroyer of the three cities and subduer of Death."
    },
    {
      book: "திருவேகம்பமாலை", title: "பெண்ணாகி வந்தொரு மாயப்பிசாசு",
      lines: ["பெண்ணாகி வந்தொரு மாயப்பி சாசும் பிடித்திட்டென்னைக்","கண்ணால் வெருட்டி முலையால் மயக்கிக் கடிதடத்துப்","புண்ணாங் குழியிடைத் தள்ளி என்போதப்பொருள் பறிக்க","எண்ணா துனைமறந் தேனிறைவா ! கச்சியேகம்பனே."],
      meaning: "பெண் உருவில் வந்த மாயப் பேய் என்னைப் பிடித்து, கண்ணால் அச்சுறுத்தி, மயக்கி, புண் போன்ற குழியில் தள்ளி, என் அறிவுச் செல்வத்தைப் பறித்தது. நான் அதை எண்ணாமல் உன்னை மறந்துவிட்டேன், இறைவா.",
      words: [["பிசாசு","பேய்"],["போதம்","அறிவு"]],
      message: "புலனின்பத்தால் அறிவும் இறையுணர்வும் இழக்கப்படுகின்றன என்னும் வருத்தம்.",
      english: "An illusory fiend in woman's guise seized me, drove away my wisdom and made me forget you, Lord."
    },
    {
      book: "திருவேகம்பமாலை", title: "நாவார வேண்டும் இதஞ்சொல்லுவார்",
      lines: ["நாவார வேண்டு மிதஞ்சொல்லுவார் உனைநான் பிரிந்தாற்","சாவேனென் றேயிருந்தொக்கவுண் பார்கள்கைதான் வறளின்","போய்வாரு மென்று நடுத்தலைக் கேகுட்டும் பூவையர்க்கு","ஈவார் தலைவிதியோ? இறைவா, கச்சியேகம்பனே."],
      meaning: "வாய்நிறையக் கனிவாகப் பேசுவார்கள்; ‘உன்னைப் பிரிந்தால் இறப்பேன்’ என்று சொல்லி ஒன்றாக உண்பார்கள். கை வறண்டு பணம் இல்லாமல் போனால் ‘போய் வா’ என்று தலையில் குட்டும் பெண்களுக்குக் கொடுப்பவரின் தலைவிதிதான் என்ன! (பொதுக்கருத்து)",
      words: [["இதம்","இனிய சொல்"],["பூவையர்","பெண்கள்"]],
      message: "பொருளுக்காக அன்பு காட்டும் நட்பின் வெற்றுத்தனம்.",
      english: "Sweet words while the purse is full, a rap on the head when the hand is empty - such is the fate of those who give to them."
    },
    {
      book: "திருவேகம்பமாலை", title: "வானமுதத்தின் சுவையறியாதவர்",
      lines: ["வானமு தத்தின் சுவையறி யாதவர் வன்கனியின்","தானமு தத்தின் சுவையெண்ணல் போலத் தனித்தனியே","தேனமு தத்தின் தெளிவாய ஞானஞ் சிறிதுமில்லார்க்","ஈனமு தச்சுவை நன்று அல்லவோ? கச்சியேகம்பனே."],
      meaning: "வானுலக அமுதத்தின் சுவையை அறியாதவர், காட்டுக் கனியின் சாற்றையே அமுதம் என எண்ணுவதுபோல, தேன்போன்ற தெளிவான ஞானம் சிறிதும் இல்லாதவர்களுக்கு இழிவான இன்பச் சுவையே நல்லதாகத் தோன்றும் அல்லவா?",
      words: [["அமுதம்","சாவா மருந்து"],["ஈனம்","இழிவு"]],
      message: "மெய்யறிவின் இனிமையை அறியாதவர் சிற்றின்பத்தையே உயர்வாகக் கருதுவர்.",
      english: "Those who never tasted heavenly nectar think a wild fruit's juice is nectar; those without wisdom think base pleasures good."
    },
    {
      book: "திருவேகம்பமாலை", title: "சொல்லால் வருங்குற்றம்",
      lines: ["சொல்லால் வருங்குற்றஞ் சிந்தனையால் வருந்தோடஞ்செய்த","பொல்லாத தீவினை பார்வையிற் பாவங்கள் புண்ணியநூல்","அல்லாத கேள்வியைக் கேட்டிடுந் தீங்குகள் ஆயவுமற்று","எல்லாப் பிழையும் பொறுத்தருள் வாய் கச்சியேகம்பனே,"],
      meaning: "சொல்லால் வரும் குற்றம், சிந்தனையால் வரும் தோஷம், செய்த தீவினை, பார்வையால் வரும் பாவம், நூல்களுக்கு மாறான செய்திகளைக் கேட்கும் தீங்கு ஆகிய எல்லாப் பிழைகளையும் பொறுத்தருள்வாய், கச்சி ஏகம்பனே.",
      words: [["தோடம்","குற்றம்"],["கேள்வி","கேட்கும் செய்தி"]],
      message: "மொழி, மனம், பார்வை, செவி ஆகியவற்றால் வரும் பிழைகளுக்கு மன்னிப்பு வேண்டல்.",
      english: "Forgive all faults of word, thought, sight and hearing, and every other fault, Lord of Kanchi."
    },
    {
      book: "திருவேகம்பமாலை", title: "முட்டற்ற மஞ்சளை எண்ணெயிற் கூட்டி",
      lines: ["முட்டற்ற மஞ்சளை யெண்ணெயிற்கூட்டி முகமினுக்கி","மெட்டிட்டுப் பொட்டிட்டுப் பித்தளையோலை விளக்கியிட்டுப்","பட்டப் பகலில் வெளிமயக் கேசெயும் பாவையர்மேல்","இட்டத்தை நீதவிர்ப்பாய் இறைவா, கச்சியேகம்பனே."],
      meaning: "மஞ்சளை எண்ணெயில் குழைத்து முகத்தை மினுக்கி, மெட்டி, பொட்டு, பித்தளை ஓலையணி ஆகியவற்றால் அலங்கரித்து, பகலிலேயே வெளித்தோற்ற மயக்கை உண்டாக்கும் பெண்கள்மீது எனக்குள்ள விருப்பத்தை நீயே நீக்குவாய், இறைவா.",
      words: [["மெட்டி","கால் விரல் அணி"],["இட்டம்","விருப்பம்"]],
      message: "அலங்காரத்தின் வெளிப்பூச்சு மயக்கத்தை உண்டாக்கும்; அதிலிருந்து மீள இறையருள் வேண்டும்.",
      english: "Lord, turn my fondness away from those whose adornment is mere outward illusion."
    },
    {
      book: "திருவேகம்பமாலை", title: "பிறந்துமண்மீதிற் பிணியே குடிகொண்டு",
      lines: ["பிறந்துமண்மீதிற் பிணியே குடிகொண்டு பேரின்பத்தை","மறந்து சிற்றின்பத்தின் மேல்மயலாகிப் புன்மாதருக்குள்","பறந்துழன்றே தடுமாறிப்பொன் தேடியப் பாவையர்க்கீந்து","இறந்திடவோ பணித்தாய் இறைவா, கச்சியேகம்பனே."],
      meaning: "மண்ணில் பிறந்து, நோய்கள் குடிகொள்ள, பேரின்பத்தை மறந்து, சிற்றின்பத்தில் மயங்கி, தாழ்ந்த பெண்களிடையே பறந்து அலைந்து, பொன் தேடி அவர்களுக்குக் கொடுத்து இறந்து போகவோ எனக்கு விதித்தாய், இறைவா?",
      words: [["மயல்","மயக்கம்"],["புன்மாதர்","தாழ்ந்த பெண்டிர்"]],
      message: "சிற்றின்பத்தில் வாழ்வு கழிவதன் வருத்தம்; பேரின்பத்தையே நாட வேண்டும்.",
      english: "Born into disease, forgetting great bliss, chasing small pleasures and spending all I earn, was I only meant to die like this?"
    },
    {
      book: "திருவேகம்பமாலை", title: "பூதங்களற்றுப் பொறியற்று",
      lines: ["பூதங்களற்றுப் பொறியற்றுச் சாரைம் புலன்களற்றுப்","பேதங்குணமற்றுப் பேராசை தானற்றுப் பின்முன்அற்றுக்","காதங்கரணங்களும் அற்ற ஆனந்தக் காட்சியிலே","ஏதங் களைந்திருப் பேனிறைவா, கச்சியேகம்பனே."],
      meaning: "பூதங்கள், பொறிகள், ஐம்புலன்கள் அற்று, வேறுபாடு, குணம், பேராசை, முன் பின் எண்ணங்கள் அற்று, அந்தக்கரணங்களும் அற்ற ஆனந்தக் காட்சியில் குற்றங்களை நீக்கி இருப்பேன், இறைவா.",
      words: [["பொறி","உடலின் புலன் உறுப்புகள்"],["கரணம்","மனம், புத்தி முதலிய அகக்கருவிகள்"],["ஏதம்","குற்றம்"]],
      message: "புலன்களும் ஆசைகளும் அடங்கிய ஆனந்த நிலையை வேண்டுதல்.",
      english: "Free of elements, organs, senses, greed and thought, may I abide faultless in the vision of bliss."
    },
    {
      book: "திருவேகம்பமாலை", title: "நல்லாய் எனக்கு மனுவொன்று",
      lines: ["நல்லா யெனக்கு மனுவொன்று தந்தருள், ஞானமிலாப்","பொல்லா எனைக்கொன்று போடும்பொழுதியல் பூசைசெபஞ்","சொல்லாநற் கோயில்நியமம் பலவகைத் தோத்திரமும்","எல்லா முடிந்தபின் கொல்லுகண்டாய் கச்சியேகம்பனே."],
      meaning: "நல்லவனே, எனக்கு ஒரு மனுவைத் தந்தருள்: ஞானமில்லாத தீயவனாகிய என்னைக் கொல்லும்போது, பூசை, செபம், கோயில் நியமங்கள், பலவகைத் துதிகள் எல்லாம் முடிந்தபின் கொல்வாய் என்பதே என் வேண்டுதல்.",
      words: [["மனு","விண்ணப்பம்"],["நியமம்","ஒழுக்க முறை, விதி"]],
      message: "வழிபாடுகளை முடித்தபின் உயிர் நீங்கட்டும் என்னும் பணிவான வேண்டுதல்.",
      english: "Grant me one petition: when you end this ignorant wretch, do so only after all worship, chanting and temple observances are done."
    },
    {
      book: "திருவேகம்பமாலை", title: "சடக்கடத்துக்கிரை தேடி",
      lines: ["சடக்கடத்துக் கிரைதேடிப் பலவுயிர் தம்மைக்கொன்று","விடக்கடித்துக் கொண்டிறுமாந் திருந்து மிகமெலிந்து","படங்கடித் தின்றுழல்வார்கள் தமைக்கரம் பற்றிநமன்","இடக்கடிக்கும் பொழுதேது செய்வார்? கச்சியேகம்பனே."],
      meaning: "உடலாகிய குடத்துக்கு உணவு தேடிப் பல உயிர்களைக் கொன்று, ஊனைத் தின்று இறுமாந்து, பின் மெலிந்து அலைபவர்களின் கையைப் பற்றி எமன் துன்புறுத்தும்போது அவர்கள் என்ன செய்வார்கள்? (இரண்டு, மூன்றாம் அடிகளின் சில சொற்கள் தெளிவற்றவை; பொதுக்கருத்து.)",
      words: [["சடம்","உடல்"],["நமன்","எமன்"]],
      message: "உயிர்க்கொலை செய்து உடல் வளர்ப்பவர்க்கு எமனிடம் தப்பிக்க வழியில்லை.",
      english: "Those who kill many lives to feed the body and grow arrogant - what will they do when Death seizes them?"
    },
    {
      book: "திருவேகம்பமாலை", title: "சொக்கிட்டு அரண்மனைப் புக்கு",
      lines: ["சொக்கிட்டு அரண்மனைப் புக்குள்திருடிய துட்டர்வந்து","திக்குற்ற மன்னரைக் கேட்பதுபோல் சிவநிந்தைசெய்து","மிக்குக் குருலிங்க சங்கமம்நிந்தித்து, வீடிச்சிக்கும்","எக்குப் பெருந்தவர்க்கென் சொல்லுவேன் ? கச்சியேகம்பனே."],
      meaning: "அரண்மனையில் புகுந்து திருடிய கொடியவன், திகைத்த மன்னனையே கேள்வி கேட்பது போல, சிவனை நிந்தித்து, குரு, லிங்கம், சங்கமம் (அடியார்) ஆகியவற்றைப் பழித்தும் மோட்சத்தை விரும்பும் செருக்கர்களுக்கு என்ன சொல்வேன்? (மின்னூலில் சில சொற்கள் தெளிவற்றவை.)",
      words: [["சங்கமம்","சிவனடியார் கூட்டம்"],["வீடு","முத்தி"],["துட்டன்","கொடியவன்"]],
      message: "இறைவன், குரு, அடியாரைப் பழித்துக்கொண்டு முத்தியை எதிர்பார்ப்பது முரண்.",
      english: "Like a palace thief questioning the king, they slander Shiva, guru and devotees yet crave liberation - what can I say to them?"
    },
    {
      book: "திருவேகம்பமாலை", title: "விருந்தாக வந்தவர் தங்களுக்கு",
      lines: ["விருந்தாக வந்தவர் தங்களுக் கன்னமிகக்கொடுக்கப்","பொருந்தார் வளம்பெற வாழ்வார்நின் நாமத்தைப்போற்றி நித்தம்","அருந்தா முலைப்பங்க ரெண்ணாதபாதகர் அம்புவியில்","இருந்தாவதேது? கண்டாய் இறைவா, கச்சியேகம்பனே."],
      meaning: "விருந்தினருக்கு மிகுதியாக உணவு கொடுக்க மனம் பொருந்தாதவர்கள், உன் நாமத்தை நாள்தோறும் போற்றாதவர்கள், உமையொருபாகனை நினையாத பாவிகள் இந்த உலகில் இருந்து ஆவது என்ன, இறைவா? (முதல் இரண்டு அடிகள் தெளிவற்றவை; பொதுக்கருத்து.)",
      words: [["விருந்து","வந்த விருந்தினர்"],["முலைப்பங்கர்","உமையொருபாகன்"]],
      message: "விருந்தோம்பலும் இறைநாமப் போற்றலும் வாழ்வின் பொருள்.",
      english: "What use is life on earth to those who do not feed guests or remember the Lord who shares his body with the Goddess?"
    },
    {
      book: "திருவேகம்பமாலை", title: "பொன்னை நினைந்து வெகுவாகத் தேடுவர்",
      lines: ["பொன்னைநினைந்து வெகுவாகத் தேடுவர், பூவையன்னாள்","தன்னைநினைந்து வெகுவாய் உருகுவார், தாரணியில்","உன்னை நினைந்திங் குனைப்பூசியாத உலுத்தரெல்லாம்","என்னையிருந்து கண்டாய் இறைவா; கச்சியேகம்பனே."],
      meaning: "பொன்னை நினைத்து மிகவும் தேடுவார்கள்; பெண்ணை நினைத்து மிகவும் உருகுவார்கள்; ஆனால் உன்னை நினைத்து வழிபடாத உலோபிகள் எல்லாம் இந்த உலகில் உள்ளனர். (கடைசி அடி தெளிவற்றது.)",
      words: [["பூவை","பெண்"],["உலுத்தர்","உலோபிகள், கருமிகள்"],["தாரணி","பூமி"]],
      message: "பொன்னையும் பெண்ணையும் நினைப்பவர் இறைவனை நினைப்பதில்லை.",
      english: "They crave gold and melt for women, but the misers never think of you or worship you."
    },
    {
      book: "திருவேகம்பமாலை", title: "கொன்றேன் அனேகமுயிரை",
      lines: ["கொன்றேன் அனேகமுயிரை எலாம்பின்பு கொன்றுகொன்று","தின்றே அதன்றியும் தீங்குசெய்தேன் அதுதீர்கவென்றே","நின்றேன் நின்சன்னிதிக்கே அதனால் குற்றம்நீபொறுப்பாய்","என்றே யுனைநம்பினேன் இறைவா, கச்சியேகம்பனே."],
      meaning: "பல உயிர்களைக் கொன்றேன்; கொன்று கொன்று தின்றேன்; அதுவன்றியும் தீங்கு செய்தேன். அது தீர வேண்டும் என்றே உன் சந்நிதியில் நின்றேன். என் குற்றத்தை நீ பொறுப்பாய் என்று உன்னை நம்பினேன், இறைவா.",
      words: [["அனேகம்","பல"],["சன்னிதி","திருமுன்"]],
      message: "பிழைகளை ஒப்புக்கொண்டு இறைவன் கருணையை நம்பி நிற்கும் பாடல்.",
      english: "I killed many lives, ate them and did other harm; I stand before you trusting you will forgive."
    },
    {
      book: "திருவேகம்பமாலை", title: "வில்லால் அடிக்கச் செருப்பாலுதைக்க",
      lines: ["வில்லால் அடிக்கச் செருப்பாலுதைக்க வெகுண்டொருவன்","கல்லால் எறியப் பிரம்பால் அடிக்கக் களிவண்டுகூர்ந்து","அல்லார் பொழில்தில்லை அம்பலவாணர்க்குஓர் அன்னைபிதா","இல்லாததால் அல்லவோ, இறைவா கச்சிஏகம்பனே."],
      meaning: "ஒருவன் வில்லால் அடிக்க, செருப்பணிந்த காலால் உதைக்க, கல்லால் எறிய, பிரம்பால் அடிக்க இறைவன் அவற்றை ஏற்றது, தில்லை அம்பலவாணருக்குத் தடுக்க ஓர் அன்னையும் பிதாவும் இல்லாததால் அல்லவோ! (இது சிவன் அடியார் பக்தியால் பெற்ற அடிகளைக் குறிப்பதாகப் பொதுவாகக் கருதப்படுகிறது; உறுதியான உரைக்கு உரை நூலைப் பார்க்கவும்.)",
      words: [["பிரம்பு","கம்பு"],["பொழில்","சோலை"]],
      message: "இறைவன் அடியாரின் எளிய, முறையற்ற செயல்களையும் அன்பாக ஏற்பவன்.",
      english: "He bears blows of bow, sandal, stone and cane - perhaps because the Lord of Thillai has no mother or father to stop it."
    },
    {
      book: "கோயிற்றிருவகவல் 1", title: "நினைமின் மனனே",
      lines: ["நினைமின் மனனே! நினைமின் மனனே!","சிவபெரு மானைச் செம்பொனம் பலவனை","நினைமின் மனனே! நினைமின் மனனே!","அலகைத் தேரி னலமரு காலின்","உலகப்பொய் வாழ்க்கையை யுடலையோம் பற்க!","பிறந்தன இறக்கும், இறந்தன பிறக்கும்;","தோன்றின மறையும், மறைந்தன தோன்றும்;","பெருத்தன சிறுக்கும், சிறுத்தன பெருக்கும்;","உணர்ந்தன மறக்கும், மறந்தன வுணரும்;","புணர்ந்தன பிரியும், பிரிந்தன புணரும்;","அருந்தின மலமாம், புனைந்தன அழுக்காம்;","உவப்பன வெறுப்பாம், வெறுப்பன உவப்பாம்;","என்றிவை யனைத்து முணர்ந்தனை, அன்றியும்","பிறந்தன பிறந்தன பிறவிக டோறும்","கொன்றனை யனைத்தும், அனைத்துநினைக் கொன்றன,","தின்றன யனைத்தும், அனைத்துநினைத் தின்றன;","பெற்றன யனைத்தும், அனைத்துநினைப் பெற்றன;","ஓம்பினை யனைத்தும், அனைத்துநினை யோம்பின;","செல்வத்துக் களித்தனை, தரித்திரத் தழுகினை;","சுவர்க்கத் திருந்தினை, நரகிற் கிடந்தனை,","இன்பமும் துன்பமும் இருநிலத் தருந்தினை;","ஒன்றென் றெழியா துற்றனை, அன்றியும்;","புற்பதக் குரம்பைத் துச்சி லொதுக்கிடம்","என்ன நின்றியங்கு மிருவினைக் கூட்டைக்","கல்லினும் வலிதாக் கருதினை, இதனுள்,","பீளையு நீரும் புலப்படு மொருபொறி;","மீளுங் குறும்பி வெளிப்படு மொருபொறி;","சளியு நீருந் தவழு மொருபொறி;","உமிழ்நீர் கோழை யழுகு மொருபொறி;","வளியு மலமும் வழங்கு மொருவழி","சலமுஞ் சீயுஞ் சரியு மொருவழி;","உள்ளுறத் தொடங்கி வெளிப்பட நாறுஞ்","சட்டக முடிவிற் சுட்டெலும் பாகும்","உடலுறு வாழ்க்கையை யுள்ளுறத் தேர்ந்து,","கடிமலர்க் கொன்றைச், சடைமுடிக் கடவுளை","ஒழிவருஞ் சிவபெரும் போகவின் பத்தை;","நிழலெனக் கடவா நீர்மையடு பொருந்தி,","எனதற நினைவற இருவனை மலமற","வரவொடு செலவற மருளற இருளற","இரவொடு பகலற இகபர மறஒரு","முதல்வனைத் தில்லையுண் முளைத்தெழுஞ் சோதியை","அம்பலத் தரசனை, ஆனந்தக் கூத்தனை,","நெருப்பினி லரக்கென நெக்குநெக் குருகித்","திருச்சிற் றம்பலத் தொளிருஞ் சிவனை","நினைமின் மனனே! நினைமின் மனனே!","சிவபெருமானைச் செம்பொனம் பலவனை,","நினைமின் மனனே! நினைமின் மனனே!"],
      meaning: "‘மனமே, செம்பொன் அம்பலத்தில் உறையும் சிவனை நினை’ என்று தொடங்குகிறது. உலக வாழ்வு கானல் நீர் போன்றது; பிறந்தவை இறக்கும், இறந்தவை பிறக்கும் என்ற நிலையாமையை நீ அறிந்தாய். பல பிறவிகளில் கொன்றும் தின்றும் கொல்லப்பட்டும் தின்னப்பட்டும் வாழ்ந்தாய்; சுவர்க்கமும் நரகமும் கண்டாய்; துன்பம் நிறைந்த இந்த உடற்கூட்டைக் கல்லினும் வலிது என்று நம்பினாய். இந்த உடலின் வாயில்கள் எல்லாம் அழுக்கு வெளிப்படும் வழிகளே; முடிவில் அது சுட்டெலும்பாகும். இதை உணர்ந்து, ‘நான், எனது’ என்ற எண்ணம் அற்று, வருதல் போதல் அற்று, தில்லையில் எழும் சோதியை, ஆனந்தக் கூத்தனை, நெருப்பில் அரக்குபோல் உருகி நினை என்று முடிகிறது.",
      words: [["அலகைத் தேர்","கானல் நீர்"],["குரம்பை","குடிசை; உடல்"],["நெக்குருகுதல்","மனம் நெகிழ்ந்து உருகுதல்"],["இருவினை","நல்வினை, தீவினை"]],
      message: "நிலையாமையை உணர்ந்து ‘நான், எனது’ என்ற பற்றை விட்டு அம்பலவனை உருகி நினைக்க வேண்டும்.",
      english: "A long call to the mind: all things born die; this body is a hut of filth ending in bones; drop 'I' and 'mine' and melt in remembering the dancing Lord of Thillai."
    },
    {
      book: "கோயிற்றிருவகவல் 2", title: "காதளவோடிய கலகப் பாதகக் கன்னியர்",
      lines: ["காதள வோடிய கலகப் பாதகக்","கன்னியர் மருங்கிற் புண்ணுட னாடுங்","காதலுங் கருத்து மல்லால்நின் னிருதாள்","பங்கயஞ் சூடப் பாக்கியஞ் செய்யாச்","சங்கடங் கூர்ந்த தமியேன் பாங்கிருந்","தங்கோ டிங்கோ டலமருங் கள்வர்","ஐவர் கலகமிட் டலைக்குங் கானகம்;","சலமலப் பேழை; யிருவினைப் பெட்டகம்;","வாதபித் தங்கோழை குடிபுகுஞ் சீறூர்;","ஊத்தைப் புன்தோ லுதிரக் கட்டளை;","நாற்றப் பாண்டம், நான்முழத் தொன்பது","பீற்றத் துண்டம், பேய்ச்சுரைத் தோட்டம்","அடலைப் பெரிய சுடலைத் திடருள்,","ஆசைக் கயிற்றி லாடும் பம்பரம்","ஓயா நோய்க்கிடம், ஓர் மரக்கலம்;","மாயா விகாரம், மரணப் பஞ்சரம்;","சோற்றுத் துருத்தி, தூற்றம் பத்தம்;","காற்றில் பறக்கும் காணப் பட்டம்;","விதிவழித் தருமன் வெட்டுங் கட்டை,","சதுர்முகப் பாணன் தைக்குஞ் சட்டை","ஈமக் கனலி லிடுசில விருந்து;","காமக் கனலிற் கருகுஞ் சருகு;","கிருமிக் கிண்டுங் கிழங்கஞ் சருமி,","பாவக்கொழுந் தேறுங் கவைக்கொழு கொம்பு","மணமாய் நடக்கும் வடிவின் முடிவிற்","பிணமாய்க் கிடக்கும் பிண்டம், பிணமேல்","ஊரிற் கிடக்க வொட்டா வுபாதி","காலெதிர் குவித்த பூளை, காலைக்","கதிரெதிர்ப் பட்ட கடும்பனிக் கூட்டம்;","அந்தரத் தியங்கு மிந்திர சாபம்;","அதிரு மேகத் துருவி னருநிழல்","நீரிற் குமிழி; நீர்மே லெழுத்து;","கண்டுயில் கனவிற் கண்ட காட்சி;","அதனினும் பொல்லா மாயக் களங்கம்;","அமையு மமையும் பிரானே, யமையும்","இமைய வல்லி வாழியென் றேத்த","ஆனந்தத் தாண்டவங் காட்டி","ஆண்டுகொண் டருள்கைநின் னருளினுக் கழகே."],
      meaning: "பெண்களிடம் கொள்ளும் காதலையும் எண்ணத்தையும் தவிர, உன் இரு திருவடித் தாமரைகளைச் சூடும் பேறு இல்லாத துன்புற்ற நான், என் உடலை இப்பாடலில் பல உவமைகளால் கூறுகிறேன்: ஐம்புலன்களாகிய திருடர் கலகம் செய்யும் காடு, மலம் நிறைந்த பெட்டி, இருவினைப் பெட்டகம், நோய்களின் இருப்பிடம், ஆசைக் கயிற்றில் ஆடும் பம்பரம், காற்றில் பறக்கும் பட்டம், நீர்க்குமிழி, நீர்மேல் எழுத்து, கனவுக் காட்சி — இவற்றினும் மாயையானது. இது போதும், பிரானே! உமையம்மை வாழ்க என்று போற்ற, ஆனந்தத் தாண்டவம் காட்டி என்னை ஆண்டருளுதல் உன் அருளுக்கு அழகு.",
      words: [["பாதகம்","தீமை"],["பம்பரம்","சுழலும் விளையாட்டுப் பொருள்"],["இந்திர சாபம்","வானவில்"],["இமையவல்லி","இமவான் மகளாகிய உமை"]],
      message: "உடலின் நிலையற்ற தன்மையை உவமைகளால் காட்டி, இறைவன் அருளையே சார்ந்து நிற்கும் வேண்டுதல்.",
      english: "The body is likened to a forest of five thieves, a casket of filth, a top on a rope of desire, a kite in the wind, a bubble and a dream; take me into your grace, dancing Lord."
    },
    {
      book: "கோயிற்றிருவகவல் 3", title: "பாற்கடல் கடையப் படுங்கடு",
      lines: ["பாற்கடல் கடையப் படுங்கடு வெண்ணெயைத்","திருமிடற் றடக்கிய சிவனே யடைக்கலம்!","அடங்கலு மடக்கிடுங் கடுங்கோலைக் காலனைக்","காலெடுத் தடக்கிய கடவுள்நின் னடைக்கலம்","உலகடங் கலும்படைத் துடையவன் றலைபறித்து","இடக்கையி லடக்கிய இறைவ! நின் னடைக்கலம்!","செய்யபொன் னம்பலச் செல்வ! நின் னடைக்கலம்!","ஐய! நின் னடைக்கலம்! அடியநின் னடைக்கலம்;","மனவழி விலைத்திடுங் கனவெனும் வாழ்க்கையும்;","விழுப்பொரு ளறியா வழுக்குறு மனனும்","ஆணவ மலத்துதித் தளைந்ததி னுளைத்திடும்","நிணவைப் புழுவெனத் தெளிந்தெடு சிந்தையும்","படிறும் பாவமும் பழிப்புறு நினைப்பும்","தவறும் அழுக்காறும் இவறுபொய்ச் சாப்பும்","கவடும் பொய்யும் சுவடும் பெருஞ்சினம்","இகலும், கொலையும், இழிப்புறு புன்மையுங்","பகையும் அச்சமும் துணிவும் பனிப்பும்","முக்குண மடமையும், ஐம்பொறி மயக்கமும்","இடும்பையும் பிணியு மிடுக்கிய ஆக்கையை","உயிரெனுங் குருருவிட் டோடுங் குரம்பையை","எலும்பொடு நரம்புகொண் டிடையிற் பிணித்துக்","கொழுந்தசை வேய்ந்து மொழுக்குவிழுங் குடிலைச்","செம்பெழு வுதிரச் சிறுபுழுக் குரம்பையை,","மலவுடற் குடத்தைப் பலவுடற் புட்டிலைத்","தொலைவிலாச் சோற்றுத் துன்பக் குழியைக்","கொலைபடைக் கலம்பல கிடக்கும் கூட்டைச்","சலிப்புறு வினைப்பல சரக்குக் குப்பையைக்","கோள்சரக் கொழுகும் பீறல் கோணியைக்","கோபத்தீ மூட்டுங் கொல்லன் துருத்தியை","ஐம்புலப் பறவை யடையும்பஞ் சரத்தை","புலராக் கவலை விளைமரப் பொதும்பை,","ஆசைக் கயிற்றி லாடுபம் பரத்தைக்","காசிற் பணத்திற் சுழலுங் காற்றாடியை,","மக்கள் வினையின் மயங்குங் திகிரியைக்","கடுவெளி யுருட்டிய சகடக் காலைப்","பாவச் சரக்கொடு பவக்கடல் புக்குக்","காமக் காற்றெடுத் தலைப்பக் கலங்கிக்","கெடுவழிக் கரைசேர் கொடுமரக் கலத்தை","இருவினை விலங்கொடு மியங்குபுற் கலனை","நடுவன்வந் தழைத்திட நடுங்கிடும் யாக்கையைப்","பிணமெனப் படுத்தியான் புறப்படும் பொழுதுநின்","அடிமலர்க் கமலத்துக் கபயநின் னடைக்கலம்","வெளியிடை யுருமிடி யிடித்தென வெறித்தெழுங்","கடுநடை வெள்விடைக் கடவுணின் னடைக்கலம்","இமையா நாட்டத் திறையே! அடைக்கலம்.","அடியார்க் கெளியாய்! அடைக்கல மடைக்கலம்;","மறையவர் தில்லை மன்று நின் றாடிக்","கருணை மொண்டலையெறி கடலே! அடைக்கலம்;","தேவரு முனிவருஞ் சென்றுநின் றேத்துப்","பாசிழைக் கொடியடு பரிந்தருள் புரியும்","எம்பெருமா நின்இணை யடிக்கு கபயம்;","அம்பலத் தரசே அடைக்கல முனக்கே!"],
      meaning: "பாற்கடலைக் கடைந்தபோது எழுந்த நஞ்சைக் கண்டத்தில் அடக்கிய சிவனே, காலனை உதைத்தவனே, பிரமனின் தலையைப் பறித்தவனே, பொன்னம்பலச் செல்வனே — உன் அடைக்கலம் என்று பாடுகிறார். பின்னர் மனக்கனவு போன்ற வாழ்க்கை, ஆணவம், பொறாமை, சினம், பகை, அச்சம் முதலிய குற்றங்களும், நோய் நிறைந்த இவ்வுடலும் எலும்பு, நரம்பு, தசையால் ஆன குடிசை, மலக் குடம், துன்பக் குழி, பம்பரம், காற்றாடி, உடைந்த படகு எனப் பல உவமைகளால் கூறப்படுகின்றன. இந்த உடலுடன் எமன் அழைக்கும்போது நடுங்கி நான் புறப்படும் வேளையில் உன் திருவடித் தாமரையே எனக்கு அடைக்கலம் என்று வேண்டி, ‘அடைக்கலம், அடைக்கலம்’ என்று முடிக்கிறார்.",
      words: [["அடைக்கலம்","புகலிடம்"],["கடுநடை வெள்விடை","விரைந்து நடக்கும் வெள்ளைக் காளை"],["ஆக்கை","உடல்"],["குரம்பை","குடிசை"]],
      message: "நிலையற்ற உடலும் குற்றங்களும் நிறைந்த தன் நிலையை உணர்ந்து இறுதிக் காலத்தில் திருவடியே புகலிடம் என்று சரண்புகுதல்.",
      english: "A hymn of refuge: to the Lord who held the poison in his throat and kicked Death; describing the body as a hut of bones, a bag of filth, a kite and a broken boat, the poet takes refuge at the Lord's lotus feet."
    },
    {
      book: "திருக்காளத்தி", title: "பத்தும் புகுந்து பிறந்து வளர்ந்து",
      lines: ["பத்தும் புகுந்து பிறந்து வளர்ந்துபட் டாடைசுற்றி,","முத்தும் பவளமும் பூண்டோடி யாடி முடிந்தபின்பு","செத்துக் கிடக்கும் பிணத்தரு கேயினிச் சாம்பிணங்கள்","கத்துங் கணக்கெண்ன? காண்கயிலாபுரிக் காளத்தியே!"],
      meaning: "பிறந்து வளர்ந்து பட்டாடை சுற்றி, முத்தும் பவளமும் பூண்டு ஓடியாடி வாழ்ந்து முடிந்தபின், இறந்து கிடக்கும் பிணத்தின் அருகே இனிச் சாகப்போகிறவர்கள் அழுது கத்தும் கணக்கு என்ன? கயிலாயபுரியாகிய காளத்தியே! (முதல் வரியின் தொடக்கச் சொல் மின்னூலில் தெளிவற்றது.)",
      words: [["பட்டாடை","பட்டு உடை"],["சாம்பிணம்","இனி இறப்பவர்"]],
      message: "அணிகளோடு வாழ்ந்தவரும் பிணமாவர்; அதைக் கண்டு அழுபவரும் சாவர்.",
      english: "After a life of silks, pearls and play comes the corpse, and those soon to die weep beside it - what sense is there in that?"
    },
    {
      book: "திருக்காளத்தி", title: "பொன்னாற் பிரயோசனம்",
      lines: ["பொன்னாற் பிரயோசனம் பொன்படைத் தார்க்குண்டு; பொன்படைத்தோன்","தன்னாற் பிரயோசனம் பொன்னுக்கங் கேதுண்டு? அத்தன்மையைப்போ","உன்னாற் பிரயோசனம் வேணதெல்லாம் உண்டுஉனைப் பணியும்","என்னாற் பிரயோசன மேதுண்டு? காளத்தி யீச்சுரனே!"],
      meaning: "பொன்னால் பயன் பொன் உடையவனுக்கு உண்டு; பொன் உடையவனால் பொன்னுக்கு என்ன பயன்? அதுபோல உன்னால் எனக்கு வேண்டிய பயன் எல்லாம் உண்டு; உன்னைப் பணியும் என்னால் உனக்கு என்ன பயன் உண்டு, காளத்தி ஈசுவரனே!",
      words: [["பிரயோசனம்","பயன்"],["ஈச்சுரன்","இறைவன்"]],
      message: "இறைவன் தரும் பயனுக்கு ஈடாக அடியவர் தர ஒன்றுமில்லை என்ற பணிவு.",
      english: "Gold benefits its owner, not the other way round; likewise all I need comes from you, and what benefit is my worship to you?"
    },
    {
      book: "திருக்காளத்தி", title: "வாளால் மகவரிந்து",
      lines: ["வாளால் மகவரிந்து ஊட்டவல்லேன் அல்லேன்; மாதுசொன்ன","சூளாலிளமை துறக்கவல்லேன் அல்லன்; தொண்டுசெய்து","நாளாறில் கண்ணிடத்து அப்பவல்லேன் அல்லன்நான் இனிச்சென்று","ஆளாவது எப்படியோ திருக்காளத்தி அப்பருக்கே?"],
      meaning: "வாளால் பிள்ளையை அரிந்து அடியாருக்கு ஊட்டும் வலிமை எனக்கில்லை; மனைவி இட்ட சூளுரையால் இளமையைத் துறக்கும் வலிமையும் இல்லை; தொண்டு செய்து ஆறாம் நாள் கண்ணைப் பிடுங்கி அப்பும் வலிமையும் இல்லை. அப்படியானால் திருக்காளத்தி அப்பருக்கு நான் எப்படி ஆளாவேன்? (நாயன்மார் வரலாறுகளைச் சுட்டும் பாடல்.)",
      words: [["மகவு","குழந்தை"],["சூள்","சபதம்"],["அப்புதல்","பொருத்துதல்"]],
      message: "நாயன்மார்களின் தியாகத்தோடு தன்னை ஒப்பிட்டு எளிமையையும் தாழ்மையையும் உணரும் பாடல்.",
      english: "I cannot slay my child for a guest, cannot renounce youth by a vow, cannot offer my eye as the saints did - how shall I ever serve the Lord of Kalahasti?"
    },
    {
      book: "திருக்காளத்தி", title: "முப்போதும் அன்னம் புசிக்கவும்",
      lines: ["முப்போது மன்னம் புசிக்கவுந் தூங்கவு மோகத்தினாற்","செப்போ திளமுலை யாருடன் சேரவுஞ் சீவன்விடு","மப்போது கண்கலக்கப் படவும் வைத்தா யையனே,","எப்போது காணவல்லேன்? திருக்காளத்தி யீச்சுரனே."],
      meaning: "மூன்று வேளையும் உண்ணவும், உறங்கவும், மோகத்தால் பெண்களுடன் சேரவும், உயிர் பிரியும்போது கண் கலங்கவும் வைத்தாய், ஐயனே. உன்னை நான் எப்போது காண வல்லவனாவேன், திருக்காளத்தி ஈசுவரனே?",
      words: [["மோகம்","ஆசை மயக்கம்"],["சீவன்","உயிர்"]],
      message: "உண்டு உறங்கிக் கழியும் வாழ்வில் இறைவனைக் காணும் நாளை ஏங்கும் பாடல்.",
      english: "You let me eat, sleep, give in to desire and weep when life leaves; when shall I truly see you, Lord of Kalahasti?"
    },
    {
      book: "திருக்காளத்தி", title: "இரைக்கே இரவும் பகலும்",
      lines: ["இரைக்கே யிரவும் பகலுந் திரிந்திங் கிளைத்துமின்னார்","அரைக்கே யவலக் குழியரு கேயசும் பார்ந்தொழுகும்","புரைக்கே யுழலுந் தமியேனை யாண்டருள், பொன்முகலிக்","கரைக்கேகல் லால நிழற்கீ ழமர்ந்தருள் காளத்தியே."],
      meaning: "உணவுக்காக இரவும் பகலும் திரிந்து இளைத்து, பெண்களின் அவலக் குழியின் அருகே உழலும் தனியனான என்னை ஆண்டருள்வாய். பொன்முகலி ஆற்றங்கரையில் கல்லால மர நிழலில் அமர்ந்தருளும் காளத்தியே! (இரண்டாம் அடியின் சில சொற்கள் தெளிவற்றவை.)",
      words: [["கல்லால நிழல்","ஆலமரத்தின் நிழல்; தட்சிணாமூர்த்தி வடிவம்"],["பொன்முகலி","காளத்தியின் அருகிலுள்ள ஆறு"]],
      message: "வயிற்றுப்பாடும் காமமும் சூழ்ந்த வாழ்விலிருந்து காக்க இறைவனை வேண்டுதல்.",
      english: "Weary from toiling day and night for food and caught in desire, I pray you rule me, O Lord seated under the banyan by the Ponmugali river."
    },
    {
      book: "திருக்காளத்தி", title: "நாறுங் குதிரைச் சலதாரை",
      lines: ["நாறுங் குதிரைச் சலதாரை தோற்புரை நாடொறுஞ்சீழ்","ஊறு மலக்குழி காமத்துவார மொளித் திடும்புண்","தேறுந் தசைப்பிளப் பந்தரங் கத்துள சிற்றின்பம்விட்டு","ஏறும் பதந்தரு வாய் திருக்காளத்தி யீச்சுரனே."],
      meaning: "நாற்றம் வீசும் கழிவின் வழிகளும், தோல் பொதிந்த உடலும், நாள்தோறும் சீழ் ஊறும் புண் போன்ற காம வாசலும் ஆகிய இந்த உடலின் சிற்றின்பத்தை விட்டு, மேலேறும் பதத்தைத் தருவாய், திருக்காளத்தி ஈசுவரனே.",
      words: [["சிற்றின்பம்","சிறிய உடல் இன்பம்"],["பதம்","உயர்ந்த நிலை"]],
      message: "உடல் இன்பத்தின் நிலையற்ற தன்மையை உணர்ந்து உயர்நிலையை வேண்டுதல்.",
      english: "Leaving the petty pleasures of this body, grant me the exalted state, Lord of Kalahasti."
    },
    {
      book: "திருக்கைலாயம்", title: "கான்சாயும் வெள்ளி மலைக்கரசே",
      lines: ["கான்சாயும் வெள்ளி மலைக்கரசே, நின்கழல் நம்பினேன்","ஊன்சாயுஞ் சென்ம மொழித்திடு வாய், காவூரனுக்காய்","மான்சாயுச் செங்கை மழுவலஞ் சாய வனைந்தகொன்றைத்","தேன்சாய நல்ல திருமேனி சாய்த்த சிவக்கொழுந்தே."],
      meaning: "வெள்ளிமலையாகிய கயிலாயத்தின் அரசே, உன் திருவடியை நம்பினேன். ஊன் சாய்ந்து அழியும் இந்தப் பிறவியை ஒழித்தருள்வாய். மான், மழு ஏந்திய செங்கரத்தையும் கொன்றைத் தேன் சொட்டும் அழகிய திருமேனியையும் உடைய சிவக்கொழுந்தே! (பாடலின் பிற்பகுதிச் சொற்கள் தெளிவற்றவை; பொதுக்கருத்து.)",
      words: [["கழல்","திருவடி"],["சென்மம்","பிறவி"],["கொழுந்து","இளம் தளிர்; சிவன் ஒளிக்கொழுந்து"]],
      message: "பிறவியை ஒழிக்க இறைவனின் திருவடியை நம்பி வேண்டுதல்.",
      english: "King of the silver mountain, I trust your feet; end this flesh-bound birth, O tender flame of Shiva."
    },
    {
      book: "திருக்கைலாயம்", title: "இல்லந் துறந்து பசிவந்த போதங்கு",
      lines: ["இல்லந் துறந்து பசிவந்த போதங் கிரந்துநின்று","பல்லுங் கரையற்று வெள்வாயுமாய், ஒன்றிற் பற்றுமின்றிச்","சொல்லும் பொருளு மிழந்து சுகானந்தத் தூக்கத்திலே","யல்லும் பகலு மிருப்பதென்றோ? கயிலா யத்தனே."],
      meaning: "வீட்டைத் துறந்து, பசி வரும்போது இரந்து நின்று, பற்கள் தேய்ந்து, வாய் வெளுத்து, எதிலும் பற்றின்றி, சொல்லும் பொருளும் இழந்து, இன்பம் தரும் ஆனந்த உறக்கநிலையில் இரவும் பகலும் இருப்பது எப்போது, கயிலாயத்தானே?",
      words: [["இரந்து","பிச்சை கேட்டு"],["சுகானந்தம்","இன்ப ஆனந்தம்"]],
      message: "துறவு வாழ்வும் ஆனந்த நிலையும் ஏங்கி வேண்டும் பாடல்.",
      english: "When shall I leave home, beg when hungry, shed every attachment and sleep day and night in the bliss of silence, Lord of Kailasa?"
    },
    {
      book: "திருக்கைலாயம்", title: "சிந்தனை யற்றுப் பிரியமுந் தானற்று",
      lines: ["சிந்தனை யற்றுப் பிரியமுந் தானற்றுச் செய்கையற்று","நினைந்தது மற்று நினையா மையுமற்று நிர்ச்சிந்தனாய்த்","தனந்தனி யேயிருந் தானந்த நித்திரை தங்குகின்ற","அனந்தலி லென்றிருப் பேனத்தனை! கயிலாயத்தனே."],
      meaning: "சிந்தனை, விருப்பம், செயல் ஆகியவை அற்று, நினைத்தது, நினையாமை என்ற இரண்டும் அற்று, சிந்தனையற்றவனாய், தனிமையில் ஆனந்தத் துயிலில் தங்கும் நிலையில் நான் இருக்கும் நாள் எப்போது, தந்தையே, கயிலாயத்தானே?",
      words: [["நிர்ச்சிந்தை","சிந்தனையற்ற நிலை"],["அனந்தல்","உறக்கம்"]],
      message: "மனம் அடங்கிய ஆனந்த நிலையை வேண்டும் பாடல்.",
      english: "When shall I be free of thought, desire and action, resting alone in blissful stillness, Father of Kailasa?"
    },
    {
      book: "திருக்கைலாயம்", title: "கையார ஏற்றுநின் றங்ஙனந் தின்று",
      lines: ["கையார ஏற்றுநின் றங்ஙனந் தின்று கரித்துணியைத்","தையா துடுத்து நின் சந்நிதிக்கே வந்துசந்ததமு","மெய்யார நிற்பணிந் துள்ளே யுரோமம் விதிர்விதிர்ப்ப","ஐயா வென்று ஓலமிடுவது என்றோ? கயிலாயத்தனே."],
      meaning: "கையால் பிச்சை ஏற்று அங்கேயே உண்டு, தைக்காத கந்தலாடை உடுத்தி, உன் சந்நிதிக்கு வந்து, எப்போதும் உடல் முழுவதும் வணங்கி, உடல் மயிர் சிலிர்க்க ‘ஐயா’ என்று கூவி அழைப்பது எப்போது, கயிலாயத்தானே?",
      words: [["கரித்துணி","கந்தல் துணி"],["உரோமம்","உடல் மயிர்"],["ஓலமிடுதல்","உரக்க அழைத்தல்"]],
      message: "எளிய துறவு வாழ்வோடு இறைவனை அழைக்கும் ஏக்கம்.",
      english: "When shall I eat alms from my hand, wear rags, bow before you with hair thrilling and cry out 'Father!'?"
    },
    {
      book: "திருக்கைலாயம்", title: "நீறார்த்த மேனி உரோமஞ் சிலிர்த்து",
      lines: ["நீறார்த்த மேனி யுரோமஞ்சிலிர்த், துளம் நெக்குநெக்குச்","சேறாய்க் கசிந்து கசிந்தே யுருகி, நின்சீரடிக்கே","மாறாத் தியானமுற் றானந்த மேற்கொண்டு மார்பிற்கண்ணீர்","ஆறாய்ப் பெருகக் கிடைப்ப தென்றோ? கயிலாயத்தனே."],
      meaning: "திருநீறு பூசிய உடல் சிலிர்க்க, உள்ளம் நெகிழ்ந்து சேறுபோல் கசிந்து உருகி, உன் அழகிய திருவடியில் மாறாத தியானம் கொண்டு, ஆனந்தத்தால் மார்பில் கண்ணீர் ஆறாகப் பெருக்கெடுக்கும் பேறு எனக்கு எப்போது கிடைக்கும், கயிலாயத்தானே?",
      words: [["நெக்குதல்","உருகுதல்"],["சீரடி","சிறப்புடைய திருவடி"]],
      message: "உருகும் பக்தியும் ஆனந்தக் கண்ணீரும் வேண்டும் பாடல்.",
      english: "When will I melt in meditation on your feet, ash-smeared and thrilled, tears streaming down my chest like a river, Lord of Kailasa?"
    },
    {
      book: "திருக்கைலாயம்", title: "செல்வரைப் பின்சென்று சங்கடம் பேசி",
      lines: ["செல்வரைப் பின்சென்று சங்கடம் பேசித், தினந்தினமும்","பல்லினைக் காட்டிப் பரிதவியாமற் பரமானந்தத்தின்","எல்லையிற் புக்கிட வேகாந்தமாய் எனக்காம் இடத்தே","அல்லல் அற்று என்றிருப் பேனத்தனே, கயிலாயத்தனே."],
      meaning: "செல்வர்களின் பின் சென்று துன்பம் கூறி, நாள்தோறும் பல்லைக் காட்டிக் கெஞ்சித் தவிக்காமல், பேரானந்தத்தின் எல்லையில் புகுந்து, தனித்து எனக்கு உரிய இடத்தில் துன்பம் நீங்கி இருக்கும் நாள் எப்போது, தந்தையே, கயிலாயத்தானே?",

    {

      message: "பூனை குட்டியைச் சுமப்பது போல் இறைவனே காப்பான் என்ற நம்பிக்கை (பொதுக்கருத்து).",
      english: "Text unclear; the sense is: carry me as a cat carries her kitten, remove my faults, for I belong to my Father. Please check a printed commentary."

      lines: ["வருந்தேன் பிறந்து மிறந்தும் மயக்கும் புலன்வழிபோய்ப்","பொருந்தேன் நரகிற் புகுகின்றிலேன், புகழ் வாரிடத்தில்","இருந்தேன் இனியவர் கூட்டம் விடேன் இயலஞ்செழுத்தாம்","அருந்தேன் அருந்துவ நின் அருளால், கயிலாயத்தனே."],

  let current = 0, size = 1.6, utter = null;

  function show(i) {
    stopSpeech();
    current = i;
    const s = songs[i];
    verse.classList.toggle("long", s.lines.length > 12);
    $("song-title").textContent = (s.book ? s.book + " – " : "") + s.title;
    verse.innerHTML = "";
    s.lines.forEach((l) => { const span = document.createElement("span"); span.textContent = l; verse.appendChild(span); });
    $("meaning").textContent = s.meaning;
    $("message").textContent = s.message;
    $("english").textContent = s.english;
    $("words").innerHTML = s.words.map(([w, m]) => `<li><b>${w}</b> – ${m}</li>`).join("");
    [...list.children].forEach((li) => {
      const on = Number(li.dataset.i) === i;
      li.firstChild.setAttribute("aria-selected", on);
      if (on) li.scrollIntoView({ block: "nearest" });
    });
  }

  function buildList(q = "") {
    list.innerHTML = "";
    songs.forEach((s, i) => {
      if (q && !(s.title + " " + s.lines.join(" ")).toLowerCase().includes(q.toLowerCase())) return;
      const li = document.createElement("li");
      li.dataset.i = i;
      const b = document.createElement("button");
      b.textContent = (i + 1) + ". " + s.title;
      b.setAttribute("aria-selected", i === current);
      b.onclick = () => show(i);
      li.appendChild(b);
      list.appendChild(li);
    });
  }
  $("search").oninput = (e) => buildList(e.target.value);
  $("btn-prev").onclick = () => show((current - 1 + songs.length) % songs.length);
  $("btn-next").onclick = () => show((current + 1) % songs.length);

  $("btn-explain").onclick = function () {
    const open = explain.hidden;
    explain.hidden = !open;
    this.setAttribute("aria-expanded", open);
    this.textContent = open ? "விளக்கத்தை மறை" : "விளக்கம் காட்டு";
  };

  function setSize(d) {
    size = Math.min(2.6, Math.max(1.0, size + d));
    verse.style.setProperty("--size", size + "rem");
  }
  $("btn-bigger").onclick = () => setSize(0.2);
  $("btn-smaller").onclick = () => setSize(-0.2);

  }
  $("btn-listen").onclick = () => {
    if (!("speechSynthesis" in window)) { alert("உங்கள் உலாவியில் குரல் வசதி இல்லை."); return; }
    stopSpeech();
    const lines = songs[current].lines;
    lines.forEach((text, n) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ta-IN"; u.rate = 0.8;
      u.onstart = () => { [...verse.children].forEach((s, k) => s.classList.toggle("active", k === n)); };
      if (n === lines.length - 1) u.onend = () => [...verse.children].forEach((s) => s.classList.remove("active"));
      speechSynthesis.speak(u);
    });
  };

  buildList();
  show(0);
</script>
</body>
</html>
